/* ---- Firestore helpers: real-time, no resending links ever ---- */
function watchDoc(name, setter, fallback) {
  return db.collection("nvl").doc(name).onSnapshot(
    (snap) => setter(snap.exists && snap.data().data !== undefined ? snap.data().data : fallback),
    (err) => console.error("watch failed", name, err)
  );
}
async function saveDoc(name, value) {
  try { await db.collection("nvl").doc(name).set({ data: value }); return true; } catch (e) { console.error("save failed", name, e); return false; }
}

  function startMatchFromSchedule(matchId) { setJumpToMatchId(matchId); setTab("live"); }
  async function toggleAuctionLive(gender) { const next = { ...auctionLive, [gender]: !auctionLive[gender] }; setAuctionLive(next); await saveDoc("auctionLive", next); }
  async function generateKnockout(gender) {
    const rows = [...(points[gender] || [])].sort((a, b) => {
      if (b.points !== a.points) return b.points - a.points;
      const ad = a.setsWon - a.setsLost, bd = b.setsWon - b.setsLost;
      if (bd !== ad) return bd - ad;
      return (b.pointsFor - b.pointsAgainst) - (a.pointsFor - a.pointsAgainst);
    });
    const [r1, r2, r3, r4] = rows;
    let newSchedule = [...schedule];
    function upsert(id, patch) {
      const idx = newSchedule.findIndex((m) => m.id === id);
      if (idx === -1) newSchedule.push({ id, gender, date: null, time: "TBD", venue: "BC ALVA INDOOR STADIUM", status: "upcoming", ...patch });
      else if (newSchedule[idx].status !== "completed") newSchedule[idx] = { ...newSchedule[idx], ...patch };
    }
    if (gender === "boys") {
      if (!r1 || !r2 || !r3 || !r4) { alert("Need at least 4 teams with results in the Boys group stage first."); return; }
      upsert("ko_boys_qualifier1", { teamAId: r1.teamId, teamBId: r2.teamId, phase: "qualifier1", label: "Qualifier 1" });
      upsert("ko_boys_eliminator", { teamAId: r3.teamId, teamBId: r4.teamId, phase: "eliminator", label: "Eliminator" });
      upsert("ko_boys_qualifier2", { teamAId: null, teamBId: null, phase: "qualifier2", label: "Qualifier 2" });
      upsert("ko_boys_final", { teamAId: null, teamBId: null, phase: "final", label: "Final" });
    } else {
      if (!r1 || !r2) { alert("Need at least 2 teams with results in the Girls group stage first."); return; }
      upsert("ko_girls_final", { teamAId: r1.teamId, teamBId: r2.teamId, phase: "final", label: "Final" });
    }
    await saveDoc("schedule", newSchedule);
  }
  async function resetKnockoutMatch(id) {
    const newSchedule = schedule.map((m) => (m.id === id ? { ...m, teamAId: null, teamBId: null, status: "upcoming", result: null } : m));
    await saveDoc("schedule", newSchedule);
  }
  async function setKnockoutTeam(matchId, side, teamId) {
    const newSchedule = schedule.map((m) => (m.id === matchId ? { ...m, [side]: teamId || null } : m));
    await saveDoc("schedule", newSchedule);
  }
  async function editPointsRow(gender, teamId, teamName, patch) {
    const rows = [...(points[gender] || [])];
    let row = rows.find((r) => r.teamId === teamId);
    if (!row) { row = emptyPointsRow(teamId, teamName); rows.push(row); }
    const idx = rows.indexOf(row);
    rows[idx] = { ...row, ...patch };
    await saveDoc("points", { ...points, [gender]: rows });
  }

  async function recalcPointsFromSchedule() {
    if (!window.confirm("This rebuilds the points table from scratch using only completed match results in the schedule (teams, players, and auction data are untouched). Any manually-edited or leftover stale numbers will be replaced. Continue?")) return;
    const newPoints = { boys: [], girls: [] };
    for (const gender of ["boys", "girls"]) {
      const rows = {};
      (teams[gender] || []).forEach((t) => { rows[t.id] = emptyPointsRow(t.id, t.name); });
      const completed = (schedule || []).filter((m) => m.gender === gender && m.status === "completed" && m.result && !String(m.id).startsWith("ko_"));
      for (const m of completed) {
        const { aSets, bSets, sets } = m.result;
        const aPts = (sets || []).reduce((s, x) => s + x.a, 0);
        const bPts = (sets || []).reduce((s, x) => s + x.b, 0);
        const winnerIsA = aSets > bSets;
        if (!rows[m.teamAId]) rows[m.teamAId] = emptyPointsRow(m.teamAId, teams[gender]?.find((t) => t.id === m.teamAId)?.name || "Team A");
        if (!rows[m.teamBId]) rows[m.teamBId] = emptyPointsRow(m.teamBId, teams[gender]?.find((t) => t.id === m.teamBId)?.name || "Team B");
        const rA = rows[m.teamAId], rB = rows[m.teamBId];
        rA.played += 1; rA.setsWon += aSets; rA.setsLost += bSets; rA.pointsFor += aPts; rA.pointsAgainst += bPts;
        rB.played += 1; rB.setsWon += bSets; rB.setsLost += aSets; rB.pointsFor += bPts; rB.pointsAgainst += aPts;
        if (winnerIsA) { rA.won += 1; rA.points += 2; rB.lost += 1; } else { rB.won += 1; rB.points += 2; rA.lost += 1; }
      }
      newPoints[gender] = Object.values(rows);
    }
    await saveDoc("points", newPoints);
  }

  async function cleanDuplicateCompletedMatches() {
    const groups = {};
    (schedule || []).forEach((m) => {
      if (m.status !== "completed" || String(m.id).startsWith("ko_")) return;
      const pairKey = `${m.gender}|${[m.teamAId, m.teamBId].sort().join("_")}`;
      if (!groups[pairKey]) groups[pairKey] = [];
      groups[pairKey].push(m);
    });
    const removeIds = new Set();
    let dupGroups = 0;
    Object.values(groups).forEach((matches) => {
      if (matches.length <= 1) return;
      dupGroups++;
      const sorted = [...matches].sort((a, b) => {
        const ta = Number(String(a.id).replace("m_", "")) || 0, tb = Number(String(b.id).replace("m_", "")) || 0;
        return tb - ta;
      });
      sorted.slice(1).forEach((m) => removeIds.add(m.id));
    });
    if (removeIds.size === 0) { alert("No duplicate completed matches found between the same two teams — nothing to clean."); return; }
    if (!window.confirm(`Found ${dupGroups} team pairing(s) with duplicate completed matches (leftover test data). This will delete ${removeIds.size} older duplicate match result(s) and keep only the most recent one for each pairing. Teams, players, and auction data are untouched. Continue?`)) return;
    const newSchedule = schedule.filter((m) => !removeIds.has(m.id));
    await saveDoc("schedule", newSchedule);
    alert("Cleaned up. Now tap 'Recalculate from Match Results' in the Points tab to refresh the table.");
  }

function LineupSetup({ match, teams, players, onConfirm, onCancel, starting }) {
  const teamA = (teams[match.gender] || []).find((t) => t.id === match.teamAId);
  const teamB = (teams[match.gender] || []).find((t) => t.id === match.teamBId);
  const rosterA = players.filter((p) => p.teamId === match.teamAId);
  const rosterB = players.filter((p) => p.teamId === match.teamBId);
  const [slotsA, setSlotsA] = useState(Array(6).fill(""));
  const [liberoA, setLiberoA] = useState("");
  const [slotsB, setSlotsB] = useState(Array(6).fill(""));
  const [liberoB, setLiberoB] = useState("");

  function SlotBox({ team, roster, slots, setSlots, libero, setLibero, color }) {
    const usedIds = new Set([...slots.filter(Boolean), libero].filter(Boolean));
    function setSlot(i, val) { const next = [...slots]; next[i] = val; setSlots(next); }
    const filledCount = slots.filter(Boolean).length;
    return (
      <div className="mb-4">
        <div className="flex items-center gap-2 mb-2"><TeamBadge team={team} size={26} overrideColor={color} /><div className="font-bold text-sm" style={{ color }}>{team?.name || "TBD"}</div><span className="text-[10px]" style={{ color: "#c9bfe0" }}>({filledCount}/6 selected)</span></div>
        {roster.length === 0 ? <div className="text-xs mb-2" style={{ color: "#ff8a8a" }}>No players sold to this team yet — go sell some in the Auction tab first.</div> : (
          <>
            <div className="grid grid-cols-2 gap-1.5 mb-2">
              {slots.map((val, i) => {
                const p = val ? roster.find((r) => r.id === val) : null;
                return (
                  <div key={i} className="relative rounded-xl" style={{ background: p ? `${color}22` : "rgba(255,255,255,0.03)", border: p ? `1.5px solid ${color}` : "1px dashed rgba(255,255,255,0.25)" }}>
                    <select value={val} onChange={(e) => setSlot(i, e.target.value)} className="w-full h-full px-2 py-2.5 rounded-xl text-xs bg-transparent appearance-none text-center" style={{ color: p ? "#fff" : "#8f84ab" }}>
                      <option value="" style={{ color: "#000" }}>➕ Position {i + 1}</option>
                      {roster.filter((r) => !usedIds.has(r.id) || r.id === val).map((r) => <option key={r.id} value={r.id} style={{ color: "#000" }}>{r.nickname || r.name}</option>)}
                    </select>
                  </div>
                );
              })}
            </div>
            <div className="relative rounded-xl" style={{ background: libero ? `${color}22` : "rgba(255,255,255,0.03)", border: libero ? `1.5px solid ${color}` : "1px dashed rgba(255,255,255,0.25)" }}>
              <select value={libero} onChange={(e) => setLibero(e.target.value)} className="w-full px-3 py-2 rounded-xl text-sm bg-transparent" style={{ color: libero ? "#fff" : "#8f84ab" }}>
                <option value="" style={{ color: "#000" }}>➕ Libero (optional)</option>
                {roster.filter((r) => !usedIds.has(r.id) || r.id === libero).map((r) => <option key={r.id} value={r.id} style={{ color: "#000" }}>{r.nickname || r.name}</option>)}
              </select>
            </div>
          </>
        )}
      </div>
    );
  }

  const readyA = slotsA.filter(Boolean).length === 6, readyB = slotsB.filter(Boolean).length === 6;

  return (
    <div className="rounded-2xl p-4" style={{ background: "rgba(255,255,255,0.06)", border: "1px solid rgba(255,255,255,0.2)" }}>
      <div className="text-xs font-bold uppercase mb-3" style={{ color: GOLD }}>Pick starting lineups</div>
      <SlotBox team={teamA} roster={rosterA} slots={slotsA} setSlots={setSlotsA} libero={liberoA} setLibero={setLiberoA} color={BLUE} />
      <SlotBox team={teamB} roster={rosterB} slots={slotsB} setSlots={setSlotsB} libero={liberoB} setLibero={setLiberoB} color={RED} />
      <div className="flex gap-2">
        <button onClick={onCancel} className="flex-1 py-2 rounded-lg font-bold text-xs uppercase" style={{ background: "rgba(255,255,255,0.1)", color: "#fff" }}>Cancel</button>
        <button onClick={() => onConfirm({ startersA: slotsA.filter(Boolean), liberoA, startersB: slotsB.filter(Boolean), liberoB })} disabled={!readyA || !readyB || starting} className="flex-1 py-2 rounded-lg font-bold text-xs uppercase" style={{ background: (!readyA || !readyB || starting) ? "rgba(255,255,255,0.15)" : GOLD, color: (!readyA || !readyB || starting) ? "#999" : PURPLE_DEEP }}>{starting ? "Starting…" : "Confirm & Start Match"}</button>
      </div>
      <div className="text-[11px] mt-2" style={{ color: "#8f84ab" }}>Tap ➕ on each box to fill it with a player. Fill all 6 boxes per team. Libero is optional.</div>
    </div>
  );
}

function LiveTab({ live, setLive, schedule, teams, points, isOrganiser, players, jumpToMatchId, onJumpHandled, feedback }) {
  const [settingUpMatchId, setSettingUpMatchId] = useState("");
  const [showTimeoutPicker, setShowTimeoutPicker] = useState(false);
  useEffect(() => {
    if (jumpToMatchId && isOrganiser && !live) {
      setSettingUpMatchId(jumpToMatchId);
      onJumpHandled && onJumpHandled();
    }
  }, [jumpToMatchId]);
  function findTeam(gender, teamId) { return (teams[gender] || []).find((x) => x.id === teamId); }
  function findPlayer(id) { return players.find((p) => p.id === id); }

  const [startingMatch, setStartingMatch] = useState(false);
  async function confirmLineupAndStart(match, { startersA, liberoA, startersB, liberoB }) {
    setStartingMatch(true);
    const newLive = { matchId: match.id, teamAId: match.teamAId, teamBId: match.teamBId, gender: match.gender, sets: [{ a: 0, b: 0 }, { a: 0, b: 0 }, { a: 0, b: 0 }], activeSet: 0, lineupA: startersA, liberoA: liberoA || null, lineupB: startersB, liberoB: liberoB || null, pointLog: [] };
    const newSchedule = schedule.map((m) => (m.id === match.id ? { ...m, status: "live" } : m));
    const ok1 = await saveDoc("live", newLive);
    const ok2 = await saveDoc("schedule", newSchedule);
    setStartingMatch(false);
    if (!ok1 || !ok2) { alert("Couldn't start the match — check your internet connection and try again."); return; }
    setLive(newLive);
    setSettingUpMatchId("");
  }

  async function addPoint(side, playerId) {
    const sets = [...live.sets];
    const idx = live.activeSet ?? 0;
    sets[idx] = { ...sets[idx], [side]: sets[idx][side] + 1 };
    const pointLog = [...(live.pointLog || []), { ts: Date.now(), setIndex: idx, team: side, playerId: playerId || null }];
    const next = { ...live, sets, pointLog };
    setLive(next);
    await saveDoc("live", next);
  }
  async function undoLastPoint() {
    const log = [...(live.pointLog || [])];
    const last = log.pop();
    if (!last) return;
    const sets = [...live.sets];
    sets[last.setIndex] = { ...sets[last.setIndex], [last.team]: Math.max(0, sets[last.setIndex][last.team] - 1) };
    const next = { ...live, sets, pointLog: log };
    setLive(next);
    await saveDoc("live", next);
  }
  async function undoLastPointForSide(side) {
    const log = [...(live.pointLog || [])];
    const lastIdx = [...log].reverse().findIndex((pt) => pt.team === side);
    if (lastIdx === -1) return;
    const realIdx = log.length - 1 - lastIdx;
    const [removed] = log.splice(realIdx, 1);
    const sets = [...live.sets];
    sets[removed.setIndex] = { ...sets[removed.setIndex], [side]: Math.max(0, sets[removed.setIndex][side] - 1) };
    const next = { ...live, sets, pointLog: log };
    setLive(next);
    await saveDoc("live", next);
  }
  async function useTimeout(side) {
    const idx = live.activeSet ?? 0;
    const timeouts = live.timeouts || { a: [0, 0, 0], b: [0, 0, 0] };
    const used = timeouts[side]?.[idx] || 0;
    if (used >= 2) return;
    const nextArr = [...(timeouts[side] || [0, 0, 0])];
    nextArr[idx] = used + 1;
    const newTimeouts = { ...timeouts, [side]: nextArr };
    const next = { ...live, timeouts: newTimeouts };
    setLive(next);
    await saveDoc("live", next);
  }
  async function endSet() {
    const idx = live.activeSet ?? 0;
    if (idx >= 2) return;
    const next = { ...live, activeSet: idx + 1 };
    setLive(next);
    await saveDoc("live", next);
  }
  async function substitute(side, outId) {
    const teamId = side === "a" ? live.teamAId : live.teamBId;
    const roster = players.filter((p) => p.teamId === teamId);
    const lineupKey = side === "a" ? "lineupA" : "lineupB";
    const bench = roster.filter((p) => !live[lineupKey].includes(p.id));
    if (bench.length === 0) { alert("No bench players available for this team."); return; }
    const names = bench.map((p, i) => `${i + 1}. ${p.nickname || p.name}`).join("\n");
    const choice = prompt(`Sub IN who for this player?\n\n${names}\n\nType the number:`);
    const chosenIdx = parseInt(choice, 10) - 1;
    if (isNaN(chosenIdx) || !bench[chosenIdx]) return;
    const inPlayer = bench[chosenIdx];
    const outPlayer = roster.find((p) => p.id === outId);
    const newLineup = live[lineupKey].map((id) => (id === outId ? inPlayer.id : id));
    const subLog = [...(live.subLog || []), { ts: Date.now(), team: side, outId, outName: outPlayer?.nickname || outPlayer?.name, inId: inPlayer.id, inName: inPlayer.nickname || inPlayer.name }];
    const next = { ...live, [lineupKey]: newLineup, subLog };
    setLive(next);
    await saveDoc("live", next);
  }

  function tally(sets) { let a = 0, b = 0; sets.forEach((s) => { if (s.a > s.b) a++; else if (s.b > s.a) b++; }); return { a, b }; }

  async function endMatch() {
    if (!live) return;
    const { a: aSetsWon, b: bSetsWon } = tally(live.sets);
    const winnerIsA = aSetsWon > bSetsWon;
    const genderKey = live.gender;
    const rows = [...(points[genderKey] || [])];
    const aPts = live.sets.reduce((sum, s) => sum + s.a, 0);
    const bPts = live.sets.reduce((sum, s) => sum + s.b, 0);
    const aTeam = findTeam(genderKey, live.teamAId), bTeam = findTeam(genderKey, live.teamBId);
    function applyResult(teamId, teamName, won, setsFor, setsAgainst, ptsFor, ptsAgainst) {
      let row = rows.find((r) => r.teamId === teamId);
      if (!row) { row = emptyPointsRow(teamId, teamName); rows.push(row); }
      row.played += 1; row.setsWon += setsFor; row.setsLost += setsAgainst; row.pointsFor += ptsFor; row.pointsAgainst += ptsAgainst;
      if (won) { row.won += 1; row.points += 2; } else { row.lost += 1; }
    }
    applyResult(live.teamAId, aTeam?.name || "Team A", winnerIsA, aSetsWon, bSetsWon, aPts, bPts);
    applyResult(live.teamBId, bTeam?.name || "Team B", !winnerIsA, bSetsWon, aSetsWon, bPts, aPts);
    const newPoints = { ...points, [genderKey]: rows };
    let newSchedule = schedule.map((m) => (m.id === live.matchId ? { ...m, status: "completed", result: { sets: live.sets, aSets: aSetsWon, bSets: bSetsWon } } : m));
    const finishedMatch = newSchedule.find((m) => m.id === live.matchId);
    const winnerId = winnerIsA ? live.teamAId : live.teamBId;
    const loserId = winnerIsA ? live.teamBId : live.teamAId;
    if (finishedMatch && genderKey === "boys") {
      if (finishedMatch.id === `ko_boys_qualifier1`) {
        newSchedule = newSchedule.map((m) => {
          if (m.id === "ko_boys_final") return { ...m, teamAId: winnerId };
          if (m.id === "ko_boys_qualifier2") return { ...m, teamAId: loserId };
          return m;
        });
      } else if (finishedMatch.id === `ko_boys_eliminator`) {
        newSchedule = newSchedule.map((m) => (m.id === "ko_boys_qualifier2" ? { ...m, teamBId: winnerId } : m));
      } else if (finishedMatch.id === `ko_boys_qualifier2`) {
        newSchedule = newSchedule.map((m) => (m.id === "ko_boys_final" ? { ...m, teamBId: winnerId } : m));
      }
    }
    await saveDoc("points", newPoints); await saveDoc("schedule", newSchedule); await saveDoc("live", null);
    setLive(null);
  }

  if (settingUpMatchId && isOrganiser) {
    const match = schedule.find((m) => m.id === settingUpMatchId);
    if (!match) {
      return (
        <div className="text-center py-10">
          <div className="flex justify-center mb-2 opacity-60"><SpinningBall size={30} /></div>
          <div className="text-xs" style={{ color: "#c9bfe0" }}>Syncing match…</div>
        </div>
      );
    }
    return <LineupSetup match={match} teams={teams} players={players} onConfirm={(lineups) => confirmLineupAndStart(match, lineups)} onCancel={() => setSettingUpMatchId("")} starting={startingMatch} />;
  }

  if (live) {
    const aTeam = findTeam(live.gender, live.teamAId), bTeam = findTeam(live.gender, live.teamBId);
    const idx = live.activeSet ?? 0;
    const completedSets = live.sets.slice(0, idx);
    const { a: aSets, b: bSets } = tally(completedSets);
    const matchDecided = aSets >= 2 || bSets >= 2;
    const currentSet = live.sets[idx];
    const lastPoints = [...(live.pointLog || [])].slice(-6).reverse();
    const serverSide = lastPoints[0] ? lastPoints[0].team : null;
    const sideColorA = BLUE, sideColorB = RED;

    return (
      <div>
        <SectionHeading emoji="📡" label="Live Score" accent={RED} />
        <div className="flex items-center justify-between mb-3">
          <div className="flex items-center gap-2"><span className="w-2 h-2 rounded-full animate-pulse" style={{ background: "#ff4d4d" }} /><span className="text-xs font-bold uppercase tracking-wider" style={{ color: "#ff8a8a" }}>Live Now</span></div>
          <GenderTag gender={live.gender} />
        </div>

        <div className="rounded-2xl p-4 mb-3" style={{ background: "rgba(255,255,255,0.06)", border: "1px solid rgba(255,255,255,0.15)", boxShadow: "0 8px 24px rgba(0,0,0,0.25)" }}>

function dayLabel(dateStr) {
  if (!dateStr) return "Date TBD";
  const d = new Date(dateStr + "T00:00:00");
  const day = d.toLocaleDateString(undefined, { weekday: "long" });
  const rest = d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
  return { day, rest };
}

function ScheduleTab({ schedule, teams, players, isOrganiser, onStartMatch }) {
  const [gender, setGender] = useState("boys");
  const [teamA, setTeamA] = useState(""); const [teamB, setTeamB] = useState("");
  const [date, setDate] = useState(""); const [time, setTime] = useState(""); const [venue, setVenue] = useState("BC ALVA INDOOR STADIUM");
  const [rosterTeam, setRosterTeam] = useState(null);
  const [previewMatch, setPreviewMatch] = useState(null);
  const [resultMatch, setResultMatch] = useState(null);
  function findTeam(g, id) { return (teams[g] || []).find((x) => x.id === id); }
  async function addMatch() {
    if (!teamA || !teamB || teamA === teamB || !date) return;
    const m = { id: `m_${Date.now()}`, gender, teamAId: teamA, teamBId: teamB, date, time, venue, status: "upcoming" };
    const newSchedule = [...schedule, m].sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
    await saveDoc("schedule", newSchedule);
    setTeamA(""); setTeamB(""); setDate(""); setTime("");
  }
  async function removeMatch(id) { await saveDoc("schedule", schedule.filter((m) => m.id !== id)); }

  const sorted = [...schedule].sort((a, b) => (a.date + (a.time || "")).localeCompare(b.date + (b.time || "")));
  const byDate = {};
  sorted.forEach((m) => { const key = m.date || "tbd"; if (!byDate[key]) byDate[key] = []; byDate[key].push(m); });
  const dateKeys = Object.keys(byDate).sort();

  return (
    <div>
      <SectionHeading emoji="📅" label="Match Schedule" accent={BLUE} />
      <div className="rounded-xl p-2.5 mb-3 text-center text-xs font-semibold" style={{ background: "rgba(84,160,255,0.12)", color: BLUE, border: `1px solid ${BLUE}` }}>📍 All matches at BC ALVA INDOOR STADIUM</div>

      {rosterTeam && <TeamRosterModal team={rosterTeam} players={players} onClose={() => setRosterTeam(null)} />}
      {previewMatch && <MatchPreviewModal match={previewMatch} teamA={findTeam(previewMatch.gender, previewMatch.teamAId)} teamB={findTeam(previewMatch.gender, previewMatch.teamBId)} players={players} onClose={() => setPreviewMatch(null)} />}
      {resultMatch && <MatchResultModal match={resultMatch} teamA={findTeam(resultMatch.gender, resultMatch.teamAId)} teamB={findTeam(resultMatch.gender, resultMatch.teamBId)} onClose={() => setResultMatch(null)} />}

      {dateKeys.length === 0 && <div className="text-sm mb-4" style={{ color: "#c9bfe0" }}>No matches scheduled yet.</div>}

      {dateKeys.map((dk) => {
        const label = dayLabel(dk === "tbd" ? null : dk);
        return (
          <div key={dk} className="mb-5">
            <div className="rounded-xl p-1 mb-2" style={{ background: `linear-gradient(90deg, ${GOLD_DEEP}, ${GOLD}, ${GOLD_DEEP})` }}>
              <div className="rounded-lg px-3 py-2 flex items-center justify-between" style={{ background: PURPLE_DEEP }}>
                <div>
                  <div style={{ fontFamily: "'Bebas Neue', sans-serif", fontSize: 20, color: GOLD, letterSpacing: "0.05em" }}>{typeof label === "string" ? label : label.day.toUpperCase()}</div>
                  {typeof label !== "string" && <div className="text-[11px]" style={{ color: "#c9bfe0" }}>{label.rest}</div>}
                </div>
                <span className="text-[10px] font-bold px-2 py-1 rounded-full" style={{ background: GOLD, color: PURPLE_DEEP }}>{byDate[dk].length} match{byDate[dk].length > 1 ? "es" : ""}</span>
              </div>
            </div>

            <div className="space-y-2.5">
              {byDate[dk].map((m, idx) => {
                const a = findTeam(m.gender, m.teamAId), b = findTeam(m.gender, m.teamBId);
                const isDone = m.status === "completed" && m.result;
                return (
                  <div key={m.id} className="rounded-xl overflow-hidden" style={{ border: `1px solid ${GOLD}`, boxShadow: "0 4px 14px rgba(0,0,0,0.3)" }}>
                    <div className="flex items-center justify-between px-2 py-1" style={{ background: "rgba(0,0,0,0.35)" }}>
                      <div className="flex items-center gap-2">
                        <span className="text-[9px] font-bold px-1.5 py-0.5 rounded-full" style={{ background: m.phase === "final" ? GOLD : m.phase === "semifinal" ? TEAL : "rgba(255,255,255,0.15)", color: (m.phase === "final" || m.phase === "semifinal") ? PURPLE_DEEP : "#e9e3f7" }}>{m.label || `Match ${idx + 1}`}</span>
                        <GenderTag gender={m.gender} /><StatusPill status={m.status} />
                      </div>
                      <div className="flex items-center gap-2">
                        <span className="text-[9px]" style={{ color: "#c9bfe0" }}>{m.date ? new Date(m.date + "T00:00:00").toLocaleDateString(undefined, { day: "2-digit", month: "short" }) : "TBD"}{m.time ? ` · ${m.time}` : ""}</span>
                        {isOrganiser && <button onClick={(e) => { e.stopPropagation(); removeMatch(m.id); }}><Ic size={14}>🗑️</Ic></button>}
                      </div>
                    </div>
                    <div className="text-center text-[9px] py-1" style={{ background: "rgba(0,0,0,0.2)", color: "#8f84ab" }}>📍 {m.venue || "BC ALVA INDOOR STADIUM"}</div>
                    <div onClick={() => (isDone ? setResultMatch(m) : setPreviewMatch(m))} className="flex items-stretch cursor-pointer" style={{ background: `linear-gradient(90deg, ${BLUE}30, rgba(0,0,0,0.15) 48%, rgba(0,0,0,0.15) 52%, ${RED}30)` }}>
                      <button onClick={(e) => { e.stopPropagation(); a && setRosterTeam(a); }} className="flex items-center gap-2 flex-1 px-2 py-2.5 justify-center">
                        <TeamBadge team={a} size={30} overrideColor={BLUE} /><span className="font-semibold text-sm" style={{ color: BLUE }}>{a?.name || "TBD"}</span>
                      </button>
                      <div className="flex flex-col items-center justify-center px-2" style={{ background: PURPLE_DEEP }}>
                        {isDone ? <div style={{ fontFamily: "'Bebas Neue', sans-serif", fontSize: 18, color: GOLD }}>{m.result.aSets}-{m.result.bSets}</div> : <div style={{ fontFamily: "'Bebas Neue', sans-serif", fontSize: 16, color: GOLD }}>VS</div>}
                      </div>
                      <button onClick={(e) => { e.stopPropagation(); b && setRosterTeam(b); }} className="flex items-center gap-2 flex-1 px-2 py-2.5 justify-center">
                        <span className="font-semibold text-sm" style={{ color: RED }}>{b?.name || "TBD"}</span><TeamBadge team={b} size={30} overrideColor={RED} />
                      </button>
                    </div>
                    {isDone && <div className="text-[11px] text-center py-1.5" style={{ background: "rgba(244,198,35,0.1)", color: GOLD }}>Tap to view full result</div>}
                    {!isDone && <div className="text-[11px] text-center py-1.5" style={{ background: "rgba(255,255,255,0.04)", color: "#c9bfe0" }}>Tap to view both squads</div>}
                    {isOrganiser && m.status === "upcoming" && (
                      <button onClick={(e) => { e.stopPropagation(); onStartMatch && onStartMatch(m.id); }} className="w-full py-1.5 font-bold text-xs uppercase" style={{ background: RED, color: "#fff" }}>▶ Start This Match</button>
                    )}
                  </div>
                );
              })}
            </div>
          </div>
        );
      })}

      {isOrganiser && (
        <div className="rounded-2xl p-4" style={{ background: "rgba(255,255,255,0.06)", border: `1px solid ${BLUE}` }}>
          <div className="text-xs font-bold uppercase mb-2" style={{ color: BLUE }}>Add a match</div>
          <div className="flex gap-2 mb-2">
            <button onClick={() => { setGender("boys"); setTeamA(""); setTeamB(""); }} className="flex-1 py-1.5 rounded-lg text-xs font-bold uppercase" style={{ background: gender === "boys" ? GOLD : "rgba(255,255,255,0.1)", color: gender === "boys" ? PURPLE_DEEP : "#fff" }}>Boys</button>
            <button onClick={() => { setGender("girls"); setTeamA(""); setTeamB(""); }} className="flex-1 py-1.5 rounded-lg text-xs font-bold uppercase" style={{ background: gender === "girls" ? GOLD : "rgba(255,255,255,0.1)", color: gender === "girls" ? PURPLE_DEEP : "#fff" }}>Girls</button>
          </div>
          <select value={teamA} onChange={(e) => setTeamA(e.target.value)} className="w-full px-3 py-2 rounded-lg text-sm mb-2" style={{ background: "rgba(255,255,255,0.1)", color: "#fff" }}><option value="">Team A…</option>{(teams[gender] || []).map((t) => <option key={t.id} value={t.id} style={{ color: "#000" }}>{t.name}</option>)}</select>
          <select value={teamB} onChange={(e) => setTeamB(e.target.value)} className="w-full px-3 py-2 rounded-lg text-sm mb-2" style={{ background: "rgba(255,255,255,0.1)", color: "#fff" }}><option value="">Team B…</option>{(teams[gender] || []).filter((t) => t.id !== teamA).map((t) => <option key={t.id} value={t.id} style={{ color: "#000" }}>{t.name}</option>)}</select>
          <input type="date" value={date} onChange={(e) => setDate(e.target.value)} className="w-full px-3 py-2 rounded-lg text-sm mb-2" style={{ background: "rgba(255,255,255,0.1)", color: "#fff" }} />
          <input type="time" value={time} onChange={(e) => setTime(e.target.value)} className="w-full px-3 py-2 rounded-lg text-sm mb-2" style={{ background: "rgba(255,255,255,0.1)", color: "#fff" }} />
          <input type="text" placeholder="Venue" value={venue} onChange={(e) => setVenue(e.target.value)} className="w-full px-3 py-2 rounded-lg text-sm mb-3" style={{ background: "rgba(255,255,255,0.1)", color: "#fff" }} />
          <button onClick={addMatch} className="w-full py-2 rounded-lg font-bold text-sm uppercase flex items-center justify-center gap-1" style={{ background: GOLD, color: PURPLE_DEEP }}><Ic size={16}>➕</Ic> Add Match</button>
        </div>
      )}
    </div>
  );
}

/* ---------------- AUCTION TAB ---------------- */
function BiddingSpotlight({ player, size = 64 }) {
  return (
    <div className="rounded-2xl p-5 mb-4 text-center" style={{ background: "rgba(244,198,35,0.08)", border: `2px solid ${GOLD}`, boxShadow: "0 8px 30px rgba(244,198,35,0.15)" }}>
      <div className="flex justify-center gap-3 mb-2" style={{ animation: "nvlbounce 1s ease-in-out infinite" }}>
        <Ic size={30}>🔨</Ic>
      </div>
      <div className="text-xs font-bold uppercase tracking-widest mb-3" style={{ color: GOLD }}>Under Bidding</div>
      <div className="flex justify-center mb-2"><PlayerAvatar player={player} size={size} /></div>
      <div className="font-bold text-lg">{player.nickname || player.name}</div>
      <div className="flex justify-center gap-1.5 mt-1"><RoleTag role={player.role} /><CategoryTag category={player.category} /></div>
    </div>
  );
}

function SoldCard({ player, team, isOrganiser, onUndo }) {
  return (
    <div className="rounded-xl relative overflow-hidden" style={{ background: `linear-gradient(135deg, ${GOLD} 0%, ${GOLD_DEEP} 100%)` }}>
      <div className="flex items-center gap-3 p-3">
        <div className="relative flex-shrink-0">
          <div className="rounded-full overflow-hidden" style={{ border: "3px solid #1a1a2e", width: 64, height: 64 }}><PlayerAvatar player={player} size={64} /></div>
          <div className="absolute inset-0 flex items-center justify-center pointer-events-none">
            <div className="text-[9px] font-black uppercase px-2 py-0.5" style={{ background: "rgba(26,26,46,0.85)", color: GOLD, transform: "rotate(-18deg)", border: "1.5px solid " + GOLD, borderRadius: 3, letterSpacing: "0.05em" }}>SOLD</div>
          </div>
        </div>
        <div className="flex-1 min-w-0">
          <div className="flex items-center gap-1.5 flex-wrap mb-0.5">
            <span className="font-black text-base leading-tight" style={{ color: "#1a1a2e", fontFamily: "'Bebas Neue', sans-serif", letterSpacing: "0.02em" }}>{(player.nickname || player.name).toUpperCase()}</span>
          </div>
          <div className="flex items-center gap-1.5 flex-wrap mb-1"><RoleTag role={player.role} /><CategoryTag category={player.category} /><PositionTag position={player.position} /></div>
          <div className="flex items-center gap-1.5 text-xs font-bold" style={{ color: "#1a1a2e" }}><TeamBadge team={team} size={20} /> TEAM — {team?.name?.toUpperCase() || "UNKNOWN"}</div>
        </div>
        {isOrganiser && <button onClick={() => onUndo(player.id)} className="flex-shrink-0 text-[10px] font-bold uppercase px-2 py-1 rounded-full" style={{ background: "rgba(26,26,46,0.85)", color: "#fff" }}>↩ Undo</button>}
      </div>
    </div>
  );
}

function AuctionTab({ players, setPlayers, teams, setTeams, points, setPoints, isOrganiser, onLoadDemo, onLoadRealRoster, onLoadRealTeams, auctionLive, setAuctionLive, onToggleAuctionLive }) {
  const [gender, setGender] = useState(() => (auctionLive?.girls && !auctionLive?.boys ? "girls" : "boys"));
  const [selectedTeam, setSelectedTeam] = useState("");
  const [position, setPosition] = useState("");
  const [pickToStart, setPickToStart] = useState("");
  const [bulkRole, setBulkRole] = useState("player");
  const [bulkCategory, setBulkCategory] = useState("A");
  const [bulkNames, setBulkNames] = useState("");
  const [bulkMsg, setBulkMsg] = useState("");
  const [showBulkImport, setShowBulkImport] = useState(false);
  const [showNewTeam, setShowNewTeam] = useState(false);
  const [newTeamName, setNewTeamName] = useState("");
  const [newTeamColor, setNewTeamColor] = useState(TEAM_COLORS[0]);
  const [categoryFilter, setCategoryFilter] = useState("all");

  const currentBidder = players.find((p) => p.gender === gender && p.auctionStatus === "bidding");
  const poolAll = players.filter((p) => p.gender === gender && !p.teamId && p.auctionStatus !== "bidding");
  const pool = categoryFilter === "all" ? poolAll : poolAll.filter((p) => p.category === categoryFilter);
  const uncategorizedCount = poolAll.filter((p) => !p.category).length;
  const sold = players.filter((p) => p.gender === gender && p.teamId && (categoryFilter === "all" || p.category === categoryFilter)).sort((a, b) => (b.soldAt || 0) - (a.soldAt || 0));
  function findTeam(id) { return (teams[gender] || []).find((x) => x.id === id); }

  async function startBidding() {
    if (!pickToStart) return;
    const picked = players.find((p) => p.id === pickToStart);
    const newPlayers = players.map((p) => {
      if (p.gender === gender && p.auctionStatus === "bidding") return { ...p, auctionStatus: null };
      if (p.id === pickToStart) return { ...p, auctionStatus: "bidding" };
      return p;
    });
    setPlayers(newPlayers);
    await saveDoc("players", newPlayers);
    setPickToStart("");
    setPosition(picked?.position || "");
  }
  async function markSold() {
    if (!currentBidder || !selectedTeam) return;
    const newPlayers = players.map((p) => p.id === currentBidder.id ? { ...p, teamId: selectedTeam, soldAt: Date.now(), auctionStatus: "sold" } : p);
    setPlayers(newPlayers);
    await saveDoc("players", newPlayers);
    setSelectedTeam(""); setShowNewTeam(false);
  }
  async function markUnsold() {
    if (!currentBidder) return;
    const newPlayers = players.map((p) => p.id === currentBidder.id ? { ...p, auctionStatus: "unsold", unsoldAt: Date.now() } : p);
    setPlayers(newPlayers);
    await saveDoc("players", newPlayers);
  }
  async function cancelBidding() {
    if (!currentBidder) return;
    const newPlayers = players.map((p) => p.id === currentBidder.id ? { ...p, auctionStatus: null } : p);
    setPlayers(newPlayers);
    await saveDoc("players", newPlayers);
  }
  async function undoSale(playerId) {
    if (!window.confirm("Undo this sale? The player will go back to the waiting pool.")) return;
    const newPlayers = players.map((p) => p.id === playerId ? { ...p, teamId: null, position: null, soldAt: null, auctionStatus: null } : p);
    await saveDoc("players", newPlayers);
  }
  async function editPhoto(playerId) {
    const url = prompt("Paste the photo URL for this player (leave blank to remove):");
    if (url === null) return;
    const newPlayers = players.map((p) => p.id === playerId ? { ...p, photoUrl: url.trim() || null } : p);
    await saveDoc("players", newPlayers);
  }
  async function setPlayerCategory(playerId, cat) {
    const newPlayers = players.map((p) => p.id === playerId ? { ...p, category: cat } : p);
    await saveDoc("players", newPlayers);
  }
  async function clearPlayerCategory(playerId) {
    const newPlayers = players.map((p) => p.id === playerId ? { ...p, category: null } : p);
    await saveDoc("players", newPlayers);
  }
  async function createTeamInline() {
    if (!newTeamName.trim()) return;
    const id = `t_${Date.now()}`;
    const newTeam = { id, name: newTeamName.trim(), color: newTeamColor, logoUrl: null, posterUrl: null };
    const newTeams = { ...teams, [gender]: [...(teams[gender] || []), newTeam] };
    await saveDoc("teams", newTeams);
    const pointsSnap = await db.collection("nvl").doc("points").get();
    const currentPoints = pointsSnap.exists && pointsSnap.data().data ? pointsSnap.data().data : { boys: [], girls: [] };
    const newPointsRows = { ...currentPoints, [gender]: [...(currentPoints[gender] || []), emptyPointsRow(id, newTeam.name)] };
    await saveDoc("points", newPointsRows);
    setSelectedTeam(id);
    setNewTeamName(""); setShowNewTeam(false);
  }
  async function bulkImport() {
    const names = bulkNames.split("\n").map((n) => n.trim()).filter(Boolean);
    if (names.length === 0) return;
    const newEntries = names.map((n, i) => ({ id: `p_bulk_${Date.now()}_${i}`, name: n, nickname: "", role: bulkRole, gender, category: bulkCategory, teamId: null, position: null, photoUrl: null, avatarId: AVATAR_DEFS[i % AVATAR_DEFS.length].id, auctionStatus: null }));
    await saveDoc("players", [...players, ...newEntries]);
    setBulkNames("");
    setBulkMsg(`Added ${names.length} category-${bulkCategory} ${gender === "boys" ? "boys'" : "girls'"} ${bulkRole}(s) to the auction pool.`);
    setTimeout(() => setBulkMsg(""), 4000);
  }

  return (
    <div>
      <SectionHeading emoji="🔨" label="Live Auction" accent={ORANGE} />

      {isOrganiser && <button onClick={onLoadRealRoster} className="w-full mb-2 py-2 rounded-lg font-bold text-xs uppercase" style={{ background: "rgba(255,159,67,0.15)", color: ORANGE, border: `1px solid ${ORANGE}` }}>📋 Load Registered Players ({REAL_ROSTER_2025.boys.length} boys + {REAL_ROSTER_2025.girls.length} girls)</button>}
      {isOrganiser && <button onClick={onLoadRealTeams} className="w-full mb-2 py-2 rounded-lg font-bold text-xs uppercase" style={{ background: "rgba(255,159,67,0.15)", color: ORANGE, border: `1px solid ${ORANGE}` }}>🛡️ Create Real Teams ({REAL_TEAMS_2025.boys.length} boys' + {REAL_TEAMS_2025.girls.length} girls')</button>}

      <div className="flex gap-2 mb-2">
        <button onClick={() => setGender("boys")} className="flex-1 py-1.5 rounded-lg text-xs font-bold uppercase relative" style={{ background: gender === "boys" ? GOLD : "rgba(255,255,255,0.1)", color: gender === "boys" ? PURPLE_DEEP : "#fff" }}>
          Boys{auctionLive?.boys && <span className="absolute top-1 right-2 w-2 h-2 rounded-full animate-pulse" style={{ background: gender === "boys" ? "#ff4d4d" : "#ff4d4d" }} />}
        </button>
        <button onClick={() => setGender("girls")} className="flex-1 py-1.5 rounded-lg text-xs font-bold uppercase relative" style={{ background: gender === "girls" ? GOLD : "rgba(255,255,255,0.1)", color: gender === "girls" ? PURPLE_DEEP : "#fff" }}>
          Girls{auctionLive?.girls && <span className="absolute top-1 right-2 w-2 h-2 rounded-full animate-pulse" style={{ background: "#ff4d4d" }} />}
        </button>
      </div>

      {!auctionLive?.[gender] && auctionLive?.[gender === "boys" ? "girls" : "boys"] && (
        <button onClick={() => setGender(gender === "boys" ? "girls" : "boys")} className="w-full rounded-xl p-2.5 mb-3 flex items-center justify-center gap-2" style={{ background: "rgba(255,80,80,0.15)", border: "1px solid #ff6b6b" }}>
          <span className="w-2 h-2 rounded-full animate-pulse" style={{ background: "#ff4d4d" }} />
          <span className="text-xs font-bold uppercase" style={{ color: "#ff8a8a" }}>{gender === "boys" ? "Girls'" : "Boys'"} auction is live now — tap to watch</span>
        </button>
      )}

      {auctionLive && auctionLive[gender] ? (
        <div className="rounded-xl p-2.5 mb-3 flex items-center justify-between" style={{ background: "rgba(255,80,80,0.12)", border: "1px solid #ff6b6b" }}>
          <div className="flex items-center gap-2"><span className="w-2 h-2 rounded-full animate-pulse" style={{ background: "#ff4d4d" }} /><span className="text-xs font-bold uppercase" style={{ color: "#ff8a8a" }}>{gender === "boys" ? "Boys'" : "Girls'"} Auction is Live</span></div>
          {isOrganiser && <button onClick={() => onToggleAuctionLive(gender)} className="text-[10px] font-bold uppercase px-2 py-1 rounded-full" style={{ background: "rgba(255,255,255,0.15)", color: "#fff" }}>End</button>}
        </div>
      ) : (
        isOrganiser && (
          <button onClick={() => onToggleAuctionLive(gender)} className="w-full mb-3 py-2 rounded-lg font-bold text-xs uppercase" style={{ background: GOLD, color: PURPLE_DEEP }}>▶ Start {gender === "boys" ? "Boys'" : "Girls'"} Auction</button>
        )
      )}
      <div className="flex gap-1.5 mb-4">
        {["all", "A", "B", "C"].map((c) => (
          <button key={c} onClick={() => setCategoryFilter(c)} className="flex-1 py-1.5 rounded-lg text-[11px] font-bold uppercase" style={{ background: categoryFilter === c ? (c === "all" ? GOLD : { A: RED, B: BLUE, C: TEAL }[c]) : "rgba(255,255,255,0.08)", color: categoryFilter === c ? PURPLE_DEEP : "#c9bfe0" }}>{c === "all" ? "All" : `Cat ${c}`}</button>
        ))}
      </div>
      {isOrganiser && uncategorizedCount > 0 && (
        <div className="rounded-xl p-2.5 mb-4 text-xs text-center" style={{ background: "rgba(255,159,67,0.1)", color: ORANGE, border: `1px solid ${ORANGE}` }}>⚠️ {uncategorizedCount} {gender === "boys" ? "boys'" : "girls'"} player(s) have no category yet — switch to Cat A/B/C above to add them one by one.</div>
      )}

      {/* Visible to everyone — the live spotlight */}
      {currentBidder && <BiddingSpotlight player={currentBidder} />}

      {isOrganiser && !currentBidder && (
        <div className="rounded-2xl p-4 mb-4" style={{ background: "rgba(255,255,255,0.06)", border: `1px solid ${GOLD}` }}>
          <div className="text-xs font-bold uppercase mb-2" style={{ color: GOLD }}>Start bidding on a player{categoryFilter !== "all" ? ` — Category ${categoryFilter}` : ""}</div>
          {pool.length === 0 ? <div className="text-xs" style={{ color: "#c9bfe0" }}>No one waiting in this category. Bulk import or wait for registrations.</div> : (
            <>
              <select value={pickToStart} onChange={(e) => setPickToStart(e.target.value)} className="w-full px-3 py-2 rounded-lg text-sm mb-2" style={{ background: "rgba(255,255,255,0.1)", color: "#fff" }}>
                <option value="">Select player…</option>
                {pool.map((p) => <option key={p.id} value={p.id} style={{ color: "#000" }}>{p.nickname || p.name} ({p.role}){p.category ? ` — Cat ${p.category}` : ""}{p.auctionStatus === "unsold" ? " — unsold last round" : ""}</option>)}
              </select>
              <button onClick={startBidding} disabled={!pickToStart} className="w-full py-2 rounded-lg font-bold text-sm uppercase" style={{ background: !pickToStart ? "rgba(255,255,255,0.15)" : GOLD, color: !pickToStart ? "#999" : PURPLE_DEEP }}>Start Bidding</button>
            </>
          )}
        </div>
      )}

      {isOrganiser && currentBidder && (
        <div className="rounded-2xl p-4 mb-4" style={{ background: "rgba(255,255,255,0.06)", border: `1px solid ${GOLD}` }}>
          <div className="text-xs font-bold uppercase mb-2" style={{ color: GOLD }}>Decide the outcome</div>
          <div className="flex gap-2 mb-3">
            <button onClick={cancelBidding} className="flex-1 py-2 rounded-lg font-bold text-xs uppercase" style={{ background: "rgba(255,255,255,0.1)", color: "#c9bfe0", border: "1px solid rgba(255,255,255,0.25)" }}>↩ Cancel (picked wrong player)</button>
            <button onClick={markUnsold} className="flex-1 py-2 rounded-lg font-bold text-xs uppercase" style={{ background: "rgba(255,80,80,0.15)", color: "#ff8a8a", border: "1px solid rgba(255,120,120,0.4)" }}>Mark Unsold</button>
          </div>
          <div className="text-[11px] uppercase mb-1.5 font-semibold" style={{ color: "#c9bfe0" }}>Or mark sold to:</div>
          <div className="w-full px-3 py-2 rounded-lg text-sm mb-2 flex items-center gap-2" style={{ background: "rgba(255,255,255,0.06)", color: "#e9e3f7" }}><span style={{ color: "#8f84ab" }}>Position (from registration):</span> <span className="font-semibold">{currentBidder.position || "—"}</span></div>
          <select value={selectedTeam} onChange={(e) => setSelectedTeam(e.target.value)} className="w-full px-3 py-2 rounded-lg text-sm mb-2" style={{ background: "rgba(255,255,255,0.1)", color: "#fff" }}><option value="">Sold to team…</option>{(teams[gender] || []).map((t) => <option key={t.id} value={t.id} style={{ color: "#000" }}>{t.name}</option>)}</select>
          <button onClick={() => setShowNewTeam(!showNewTeam)} className="text-[11px] font-semibold uppercase mb-2" style={{ color: TEAL }}>{showNewTeam ? "✕ Cancel new team" : "+ Team not listed yet? Add one"}</button>
          {showNewTeam && (
            <div className="rounded-lg p-3 mb-2" style={{ background: "rgba(255,255,255,0.05)" }}>

        <div className="space-y-1.5">{pool.map((p) => (

/* ---------------- POINTS TAB ---------------- */
function rankBadgeColor(pos) {
  if (pos === 1) return { bg: GOLD, fg: PURPLE_DEEP };
  if (pos === 2) return { bg: "#c9d0da", fg: "#2a2a33" };
  if (pos === 3) return { bg: "#d9915a", fg: "#2a2a33" };
  return { bg: "rgba(255,255,255,0.12)", fg: "#e9e3f7" };
}
function PointsTable({ title, rows, teams, qualifiers, placeholderCount, isOrganiser, onEdit }) {
  const [editingId, setEditingId] = useState(null);
  const [form, setForm] = useState({});
  const sorted = [...rows].sort((a, b) => {
    if (b.points !== a.points) return b.points - a.points;
    const aSetDiff = a.setsWon - a.setsLost, bSetDiff = b.setsWon - b.setsLost;
    if (bSetDiff !== aSetDiff) return bSetDiff - aSetDiff;
    return (b.pointsFor - b.pointsAgainst) - (a.pointsFor - a.pointsAgainst);
  });
  function findTeam(id) { return teams.find((t) => t.id === id); }
  const showPlaceholders = sorted.length === 0 && placeholderCount;
  const displayRows = showPlaceholders ? Array.from({ length: placeholderCount }).map((_, i) => ({ teamId: `ph_${i}`, teamName: "", played: 0, won: 0, lost: 0, setsWon: 0, setsLost: 0, pointsFor: 0, pointsAgainst: 0, points: 0, placeholder: true })) : sorted;
  function startEdit(r) {
    setEditingId(r.teamId);
    setForm({ played: r.played, won: r.won, lost: r.lost, setsWon: r.setsWon, setsLost: r.setsLost, pointsFor: r.pointsFor, pointsAgainst: r.pointsAgainst, points: r.points });
  }
  function saveEdit(r) {
    onEdit(r.teamId, r.teamName || findTeam(r.teamId)?.name || "Team", {
      played: Number(form.played) || 0, won: Number(form.won) || 0, lost: Number(form.lost) || 0,
      setsWon: Number(form.setsWon) || 0, setsLost: Number(form.setsLost) || 0,
      pointsFor: Number(form.pointsFor) || 0, pointsAgainst: Number(form.pointsAgainst) || 0, points: Number(form.points) || 0,
    });
    setEditingId(null);
  }
  const numField = (key, w) => <input type="number" value={form[key]} onChange={(e) => setForm({ ...form, [key]: e.target.value })} className="rounded text-center text-xs px-1 py-1" style={{ width: w, background: "rgba(255,255,255,0.12)", color: "#fff" }} />;
  return (
    <div className="mb-6">
      <div className="rounded-xl p-2.5 mb-3 text-center" style={{ background: `linear-gradient(90deg, ${PURPLE_DEEP}, rgba(244,198,35,0.15))`, border: `1px solid ${GOLD}` }}>
        <div style={{ fontFamily: "'Playfair Display', serif", fontWeight: 900, fontSize: 18, color: GOLD }}>🏐 {title}</div>
        <div className="text-[10px] uppercase tracking-widest" style={{ color: "#c9bfe0" }}>Group Stage</div>
      </div>
      {displayRows.length === 0 ? <div className="text-sm" style={{ color: "#c9bfe0" }}>No results yet.</div> : (
        <div className="rounded-xl overflow-x-auto">
          <div style={{ minWidth: 460 }}>
            <div className="flex items-center gap-1 px-2 py-1.5 text-[9px] font-bold uppercase" style={{ color: "#8f84ab" }}>
              <div style={{ width: 22 }}>#</div><div style={{ width: 108 }}>Team</div>
              <div style={{ width: 26 }} className="text-center">P</div><div style={{ width: 26 }} className="text-center">W</div><div style={{ width: 26 }} className="text-center">L</div>
              <div style={{ width: 44 }} className="text-center">Set D</div><div style={{ width: 48 }} className="text-center">Pt D</div>
              <div style={{ width: 32 }} className="text-right">Pts</div>
              {isOrganiser && <div style={{ width: 40 }} />}
            </div>
            {displayRows.map((r, i) => {
              const pos = i + 1; const badge = rankBadgeColor(pos);
              const setDiff = r.setsWon - r.setsLost; const ptDiff = r.pointsFor - r.pointsAgainst;
              const qualified = qualifiers ? pos <= qualifiers : null;
              const rowBg = qualified === null ? (i % 2 === 0 ? "rgba(255,255,255,0.05)" : "rgba(255,255,255,0.02)") : qualified ? "rgba(34,197,94,0.18)" : "rgba(239,68,68,0.18)";
              const rowBorder = qualified === null ? "transparent" : qualified ? "rgba(34,197,94,0.5)" : "rgba(239,68,68,0.5)";
              return (
                <div key={r.teamId}>
                  <div className="flex items-center gap-1 px-2 py-2.5" style={{ background: rowBg, borderLeft: `3px solid ${rowBorder}` }}>
                    <div style={{ width: 22 }}><div className="w-5 h-5 rounded-full flex items-center justify-center text-[10px] font-bold" style={{ background: badge.bg, color: badge.fg }}>{pos}</div></div>
                    <div style={{ width: 108 }} className="flex items-center gap-1.5 min-w-0">
                      {r.placeholder ? <div className="rounded-full flex-shrink-0" style={{ width: 20, height: 20, background: "rgba(255,255,255,0.08)" }} /> : <TeamBadge team={findTeam(r.teamId)} size={20} />}
                      <div className="text-xs font-semibold truncate" style={{ color: r.placeholder ? "#5c5273" : "#fff" }}>{r.placeholder ? "—" : r.teamName}</div>
                    </div>
                    <div style={{ width: 26, color: r.placeholder ? "#5c5273" : "#fff" }} className="text-center text-xs">{r.played}</div>
                    <div style={{ width: 26, color: r.placeholder ? "#5c5273" : "#7be8a4" }} className="text-center text-xs">{r.won}</div>
                    <div style={{ width: 26, color: r.placeholder ? "#5c5273" : "#ff8a8a" }} className="text-center text-xs">{r.lost}</div>
                    <div style={{ width: 44, color: r.placeholder ? "#5c5273" : (setDiff >= 0 ? "#7be8a4" : "#ff8a8a") }} className="text-center text-xs">{r.placeholder ? "0" : (setDiff > 0 ? `+${setDiff}` : setDiff)}</div>
                    <div style={{ width: 48, color: r.placeholder ? "#5c5273" : (ptDiff >= 0 ? "#7be8a4" : "#ff8a8a") }} className="text-center text-xs">{r.placeholder ? "0" : (ptDiff > 0 ? `+${ptDiff}` : ptDiff)}</div>
                    <div style={{ width: 32, color: r.placeholder ? "#5c5273" : GOLD, fontFamily: "'Bebas Neue', sans-serif", fontSize: 15 }} className="text-right font-bold">{r.points || 0}</div>
                    {isOrganiser && !r.placeholder && <div style={{ width: 40 }} className="text-right"><button onClick={() => (editingId === r.teamId ? setEditingId(null) : startEdit(r))} className="text-[10px]">✏️</button></div>}
                  </div>
                  {editingId === r.teamId && (
                    <div className="px-3 py-2 flex flex-wrap items-center gap-1.5" style={{ background: "rgba(0,0,0,0.25)" }}>
                      <span className="text-[9px]" style={{ color: "#8f84ab" }}>P</span>{numField("played", 34)}
                      <span className="text-[9px]" style={{ color: "#8f84ab" }}>W</span>{numField("won", 34)}
                      <span className="text-[9px]" style={{ color: "#8f84ab" }}>L</span>{numField("lost", 34)}
                      <span className="text-[9px]" style={{ color: "#8f84ab" }}>SetsW</span>{numField("setsWon", 34)}
                      <span className="text-[9px]" style={{ color: "#8f84ab" }}>SetsL</span>{numField("setsLost", 34)}
                      <span className="text-[9px]" style={{ color: "#8f84ab" }}>PtsFor</span>{numField("pointsFor", 44)}
                      <span className="text-[9px]" style={{ color: "#8f84ab" }}>PtsAg</span>{numField("pointsAgainst", 44)}
                      <span className="text-[9px]" style={{ color: "#8f84ab" }}>Table Pts</span>{numField("points", 44)}
                      <button onClick={() => saveEdit(r)} className="text-[10px] font-bold uppercase px-2 py-1 rounded-full" style={{ background: GOLD, color: PURPLE_DEEP }}>Save</button>
                      <button onClick={() => setEditingId(null)} className="text-[10px] font-bold uppercase px-2 py-1 rounded-full" style={{ background: "rgba(255,255,255,0.1)", color: "#fff" }}>Cancel</button>
                    </div>
                  )}
                </div>
              );
            })}
          </div>
          {qualifiers && (
            <div className="flex items-center gap-3 px-3 py-2" style={{ background: "rgba(0,0,0,0.2)" }}>
              <div className="flex items-center gap-1 text-[10px]" style={{ color: "#7be8a4" }}><span className="w-2.5 h-2.5 rounded-sm" style={{ background: "rgba(34,197,94,0.6)" }} /> Advances to knockout</div>
              <div className="flex items-center gap-1 text-[10px]" style={{ color: "#ff8a8a" }}><span className="w-2.5 h-2.5 rounded-sm" style={{ background: "rgba(239,68,68,0.6)" }} /> Eliminated</div>
            </div>
          )}
        </div>
      )}
    </div>
  );
}
function KnockoutMatchCard({ match, teams, label, isOrganiser, onSetTeam, onReset }) {
  const [editSide, setEditSide] = useState(null);
  function findTeam(id) { return teams.find((t) => t.id === id); }
  const a = findTeam(match?.teamAId), b = findTeam(match?.teamBId);
  const isDone = match?.status === "completed" && match?.result;
  return (
    <div className="rounded-xl p-3 mb-2.5" style={{ background: "rgba(255,255,255,0.06)", border: `1px solid ${GOLD}` }}>
      <div className="flex items-center justify-between mb-1.5">
        <div className="text-[10px] font-bold uppercase" style={{ color: GOLD }}>{label}</div>
        {isOrganiser && match && <button onClick={() => onReset(match.id)} className="text-[9px] font-bold uppercase px-1.5 py-0.5 rounded-full" style={{ background: "rgba(255,255,255,0.1)", color: "#c9bfe0" }}>↩ Reset</button>}
      </div>
      <div className="flex items-center justify-between">
        <div className="flex items-center gap-1.5 cursor-pointer" onClick={() => isOrganiser && match && setEditSide(editSide === "teamAId" ? null : "teamAId")}>
          <TeamBadge team={a} size={22} overrideColor={BLUE} /><span className="text-xs font-semibold" style={{ color: a ? "#fff" : "#8f84ab" }}>{a?.name || "TBD"}</span>
        </div>
        <span className="text-[10px] font-bold" style={{ color: "#8f84ab" }}>{isDone ? `${match.result.aSets}-${match.result.bSets}` : "vs"}</span>
        <div className="flex items-center gap-1.5 cursor-pointer" onClick={() => isOrganiser && match && setEditSide(editSide === "teamBId" ? null : "teamBId")}>
          <span className="text-xs font-semibold" style={{ color: b ? "#fff" : "#8f84ab" }}>{b?.name || "TBD"}</span><TeamBadge team={b} size={22} overrideColor={RED} />

      </div>
      {editSide && (
        <select autoFocus value={match[editSide] || ""} onChange={(e) => { onSetTeam(match.id, editSide, e.target.value); setEditSide(null); }} className="w-full mt-2 px-2 py-1.5 rounded-lg text-xs" style={{ background: "rgba(255,255,255,0.12)", color: "#fff" }}>

          {teams.map((t) => <option key={t.id} value={t.id} style={{ color: "#000" }}>{t.name}</option>)}
        </select>
      )}
    </div>
  );
}
function KnockoutBracket({ schedule, teams, gender, isOrganiser, onGenerate, onSetTeam, onReset }) {

          <KnockoutMatchCard match={findMatch("ko_boys_qualifier2")} teams={genderTeams} label="Qualifier 2 — Qualifier 1 loser vs Eliminator winner" isOrganiser={isOrganiser} onSetTeam={onSetTeam} onReset={onReset} />

      <div className="flex gap-2 mb-4">
        <button onClick={() => setStage("group")} className="flex-1 py-1.5 rounded-lg text-xs font-bold uppercase" style={{ background: stage === "group" ? TEAL : "rgba(255,255,255,0.08)", color: stage === "group" ? PURPLE_DEEP : "#c9bfe0" }}>Group Stage</button>
        <button onClick={() => setStage("knockout")} className="flex-1 py-1.5 rounded-lg text-xs font-bold uppercase" style={{ background: stage === "knockout" ? TEAL : "rgba(255,255,255,0.08)", color: stage === "knockout" ? PURPLE_DEEP : "#c9bfe0" }}>Knockout Stage</button>
      </div>
      {stage === "group" ? (
        <>
          {isOrganiser && <div className="text-[11px] mb-3" style={{ color: "#8f84ab" }}>↔️ Scroll sideways to see all columns. Tap ✏️ on a row to fix any stat manually.</div>}
          <PointsTable title="Boys Points Table" rows={points.boys || []} teams={teams.boys || []} qualifiers={4} placeholderCount={6} isOrganiser={isOrganiser} onEdit={(id, name, patch) => onEditRow("boys", id, name, patch)} />
          <PointsTable title="Girls Points Table" rows={points.girls || []} teams={teams.girls || []} qualifiers={2} placeholderCount={3} isOrganiser={isOrganiser} onEdit={(id, name, patch) => onEditRow("girls", id, name, patch)} />
        </>
      ) : (
        <>
          <div className="text-xs font-bold uppercase mb-2" style={{ color: BLUE }}>Boys Knockout — Road to the Final</div>
          <div className="mb-5"><KnockoutBracket schedule={schedule} teams={teams} gender="boys" isOrganiser={isOrganiser} onGenerate={onGenerateKnockout} onSetTeam={onSetKnockoutTeam} onReset={onResetKnockout} /></div>
          <div className="text-xs font-bold uppercase mb-2" style={{ color: RED }}>Girls Knockout — Road to the Final</div>
          <KnockoutBracket schedule={schedule} teams={teams} gender="girls" isOrganiser={isOrganiser} onGenerate={onGenerateKnockout} onSetTeam={onSetKnockoutTeam} onReset={onResetKnockout} />
        </>
      )}
      <div className="text-[11px] mt-3" style={{ color: "#8f84ab" }}>Set D = set difference, Pt D = point difference. Win = 2 pts, Loss = 0. Ranking: Points → Set Diff → Point Diff. Updates automatically when a live match ends.</div>
    </div>
  );
}

/* ---------------- TEAMS TAB ---------------- */
function TeamRosterList({ team, roster }) {
  const owner = roster.find((p) => p.role === "owner");
  const squad = roster.filter((p) => p.role !== "owner");
  if (roster.length === 0) return null;
  return (
    <div className="rounded-xl p-3 mb-2" style={{ background: `linear-gradient(160deg, #1a1a2e 0%, ${team.color}22 100%)`, border: `1px solid ${team.color}` }}>
      <div className="flex items-center justify-between mb-2.5">
        <div className="text-[10px] font-bold uppercase tracking-widest" style={{ color: team.color }}>Squad ({squad.length})</div>
        {owner && <div className="text-[10px]" style={{ color: "#c9bfe0" }}>👑 {owner.nickname || owner.name}</div>}
      </div>
      <div className="grid grid-cols-3 gap-1.5">
        {squad.map((p, i) => (
          <div key={p.id} className="relative rounded-lg overflow-hidden" style={{ aspectRatio: "3/4", background: "#0d0d1a" }}>
            <div className="absolute top-1 left-1 z-10 w-5 h-5 rounded-full flex items-center justify-center text-[10px] font-black" style={{ background: team.color, color: "#1a1a2e" }}>{i + 1}</div>
            {p.photoUrl ? (
              <img src={p.photoUrl} alt={p.name} className="w-full h-full object-cover" onError={(e) => { e.target.style.display = "none"; }} />
            ) : (
              <div className="w-full h-full flex items-center justify-center"><CartoonAvatar id={p.avatarId} size={48} /></div>
            )}
            <div className="absolute bottom-0 left-0 right-0 px-1 py-1.5 text-center" style={{ background: `linear-gradient(0deg, ${team.color}f2 0%, ${team.color}00 100%)` }}>
              <div className="text-[10px] font-black uppercase truncate" style={{ color: "#fff", fontFamily: "'Bebas Neue', sans-serif", letterSpacing: "0.03em" }}>{p.nickname || p.name}</div>
              {p.position && <div className="text-[7px] font-semibold truncate" style={{ color: "rgba(255,255,255,0.9)" }}>{p.position}</div>}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

function TeamsTab({ teams, players, points, isOrganiser }) {
  const [gender, setGender] = useState("boys");
  const [newName, setNewName] = useState("");
  const [newColor, setNewColor] = useState(TEAM_COLORS[0]);
  const [posterEdits, setPosterEdits] = useState({});
  const selfRegistered = players.filter((p) => p.source === "self").sort((a, b) => (b.registeredAt || 0) - (a.registeredAt || 0));

  async function addTeam() {
    if (!newName.trim()) return;
    const id = `t_${Date.now()}`;
    const newTeams = { ...teams, [gender]: [...(teams[gender] || []), { id, name: newName.trim(), color: newColor, logoUrl: null, posterUrl: null }] };
    const newPointsRows = { ...points, [gender]: [...(points[gender] || []), emptyPointsRow(id, newName.trim())] };
    await saveDoc("teams", newTeams); await saveDoc("points", newPointsRows);
    setNewName("");
  }
  async function savePoster(g, teamId) {
    const url = posterEdits[teamId];
    if (url === undefined) return;
    const newTeams = { ...teams, [g]: teams[g].map((t) => t.id === teamId ? { ...t, posterUrl: url.trim() || null } : t) };
    await saveDoc("teams", newTeams);
  }
  async function clearAllPlayers() {
    if (!window.confirm("This will remove every registered player and owner, and empty every team roster and the auction pool. This can't be undone. Continue?")) return;
    await saveDoc("players", []);
  }
  async function clearSelfRegistered() {
    const junk = players.filter((p) => p.source === "self");
    if (junk.length === 0) { alert("No leftover self-registered entries found — nothing to clean."); return; }
    if (!window.confirm(`Found ${junk.length} old self-registered "create your card" entries. This removes only those and leaves your real roster (from the Excel import) completely untouched. Continue?`)) return;
    await saveDoc("players", players.filter((p) => p.source !== "self"));
  }
  async function resetTeamsAndAuction() {
    if (!window.confirm("This clears ALL teams, ALL players, and resets the points table for both Boys and Girls — a full clean slate. This can't be undone. Continue?")) return;
    await saveDoc("teams", { boys: [], girls: [] });
    await saveDoc("players", []);
    await saveDoc("points", { boys: [], girls: [] });
  }
  function playersFor(teamId) { return players.filter((p) => p.teamId === teamId); }

  return (
    <div>
      <SectionHeading emoji="👥" label="Teams" accent={TEAL} />
      {["boys", "girls"].map((g) => {
        const unsoldCount = players.filter((p) => p.gender === g && !p.teamId).length;
        return (
          <div key={g} className="mb-5">
            <div className="text-xs font-bold uppercase mb-2 tracking-wide flex items-center justify-between" style={{ color: GOLD }}>
              <span>{g === "boys" ? "Boys Teams (6)" : "Girls Teams (3)"}</span>
              {unsoldCount > 0 && <span className="text-[10px] normal-case font-normal" style={{ color: "#c9bfe0" }}>{unsoldCount} waiting in auction pool</span>}
            </div>
            {(teams[g] || []).length === 0 && <div className="text-sm mb-2" style={{ color: "#c9bfe0" }}>No teams added yet.</div>}
            <div className="space-y-2">
              {(teams[g] || []).map((t) => (
                <div key={t.id} className="rounded-xl p-3" style={{ background: "rgba(255,255,255,0.06)" }}>
                  <div className="flex items-center gap-2 mb-2"><TeamBadge team={t} size={32} /><div className="font-bold text-sm">{t.name}</div></div>
                  {playersFor(t.id).length === 0 ? (
                    <div className="text-xs mb-2" style={{ color: "#8f84ab" }}>No players sold to this team yet — the squad list builds itself automatically as the auction fills the team.</div>
                  ) : (
                    <TeamRosterList team={t} roster={playersFor(t.id)} />
                  )}
                  {t.posterUrl && <img src={t.posterUrl} alt={`${t.name} poster`} className="w-full rounded-lg mb-2 mt-2" style={{ maxHeight: 160, objectFit: "cover" }} onError={(e) => { e.target.style.display = "none"; }} />}
                  {isOrganiser && (
                    <div className="flex gap-2 mt-2">
                      <input placeholder="Or paste a custom poster image URL" defaultValue={t.posterUrl || ""} onChange={(e) => setPosterEdits({ ...posterEdits, [t.id]: e.target.value })} className="flex-1 px-2 py-1.5 rounded-lg text-xs" style={{ background: "rgba(255,255,255,0.1)", color: "#fff" }} />
                      <button onClick={() => savePoster(g, t.id)} className="px-2 rounded-lg" style={{ background: GOLD, color: PURPLE_DEEP }}><Ic size={14}>🖼️</Ic></button>
                    </div>
                  )}
                </div>
              ))}
            </div>
          </div>
        );
      })}
      {isOrganiser && (
        <div className="rounded-2xl p-4" style={{ background: "rgba(255,255,255,0.06)", border: `1px solid ${TEAL}` }}>
          <div className="text-xs font-bold uppercase mb-2" style={{ color: TEAL }}>Add a team</div>
          <div className="flex gap-2 mb-2">
            <button onClick={() => setGender("boys")} className="flex-1 py-1.5 rounded-lg text-xs font-bold uppercase" style={{ background: gender === "boys" ? GOLD : "rgba(255,255,255,0.1)", color: gender === "boys" ? PURPLE_DEEP : "#fff" }}>Boys</button>
            <button onClick={() => setGender("girls")} className="flex-1 py-1.5 rounded-lg text-xs font-bold uppercase" style={{ background: gender === "girls" ? GOLD : "rgba(255,255,255,0.1)", color: gender === "girls" ? PURPLE_DEEP : "#fff" }}>Girls</button>
          </div>
          <input value={newName} onChange={(e) => setNewName(e.target.value)} placeholder="Team name" className="w-full px-3 py-2 rounded-lg text-sm mb-2" style={{ background: "rgba(255,255,255,0.1)", color: "#fff" }} />
          <div className="text-[11px] uppercase mb-1.5 font-semibold" style={{ color: "#c9bfe0" }}>Badge color</div>
          <div className="flex gap-2 mb-3 flex-wrap">{TEAM_COLORS.map((c) => (<button key={c} onClick={() => setNewColor(c)} className="w-7 h-7 rounded-full" style={{ background: c, border: newColor === c ? `2px solid ${GOLD}` : "2px solid transparent" }} />))}</div>
          <button onClick={addTeam} className="w-full py-2 rounded-lg font-bold text-sm uppercase flex items-center justify-center gap-1" style={{ background: GOLD, color: PURPLE_DEEP }}><Ic size={16}>➕</Ic> Add Team</button>
        </div>
      )}
      {isOrganiser && (
        <div className="rounded-2xl p-4 mt-4" style={{ background: "rgba(255,255,255,0.06)", border: `1px solid ${TEAL}` }}>
          <div className="text-xs font-bold uppercase mb-2" style={{ color: TEAL }}>Registered via App ({selfRegistered.length})</div>
          {selfRegistered.length === 0 ? (
            <div className="text-xs" style={{ color: "#c9bfe0" }}>No one has registered through the app yet.</div>
          ) : (
            <div className="space-y-1.5 max-h-64 overflow-y-auto">
              {selfRegistered.map((p) => (
                <div key={p.id} className="flex items-center gap-2 px-2 py-1.5 rounded-lg" style={{ background: "rgba(255,255,255,0.05)" }}>
                  <CartoonAvatar id={p.avatarId} size={22} />
                  <span className="text-xs flex-1">{p.nickname || p.name}</span>
                  <RoleTag role={p.role} />
                  <span className="text-[9px] font-bold px-1.5 py-0.5 rounded-full uppercase" style={{ background: "rgba(255,255,255,0.1)", color: "#c9bfe0" }}>{p.gender}</span>
                </div>
              ))}
            </div>
          )}
        </div>
      )}
      {isOrganiser && (
        <div className="rounded-2xl p-4 mt-4" style={{ background: "rgba(255,80,80,0.06)", border: "1px solid rgba(255,120,120,0.4)" }}>
          <div className="text-xs font-bold uppercase mb-2" style={{ color: "#ff8a8a" }}>Danger zone</div>
          <button onClick={clearSelfRegistered} className="w-full py-2 rounded-lg font-bold text-xs uppercase flex items-center justify-center gap-1 mb-2" style={{ background: "rgba(255,180,50,0.15)", color: "#ffcf7a", border: "1px solid rgba(255,180,50,0.4)" }}><Ic size={14}>🧹</Ic> Remove Old Self-Registered Entries (keeps real roster)</button>
          <button onClick={clearAllPlayers} className="w-full py-2 rounded-lg font-bold text-xs uppercase flex items-center justify-center gap-1" style={{ background: "rgba(255,80,80,0.15)", color: "#ff8a8a", border: "1px solid rgba(255,120,120,0.4)" }}><Ic size={14}>🗑️</Ic> Clear All Registered Players</button>
          <button onClick={resetTeamsAndAuction} className="w-full py-2 rounded-lg font-bold text-xs uppercase flex items-center justify-center gap-1 mt-2" style={{ background: "rgba(255,80,80,0.15)", color: "#ff8a8a", border: "1px solid rgba(255,120,120,0.4)" }}><Ic size={14}>🗑️</Ic> Full Reset (clear teams + players + points)</button>
        </div>
      )}
    </div>
  );
}

/* ---------------- FEEDBACK TAB ---------------- */
function FeedbackTab({ feedback, chatProfile, onSaveChatProfile, isOrganiser }) {
  const [msg, setMsg] = useState("");
  const [nameInput, setNameInput] = useState("");
  const [avatarPick, setAvatarPick] = useState(AVATAR_DEFS[0].id);
  const postingAs = chatProfile ? chatProfile.name : null;
  const QUICK_EMOJIS = ["👍", "🔥", "🏐", "😂", "❤️", "🎉", "👏", "😮"];
  async function post() {
    if (!msg.trim() || !postingAs) return;
    const item = { id: `f_${Date.now()}`, name: postingAs, message: msg.trim(), ts: Date.now(), avatarId: chatProfile?.avatarId || null };
    await saveDoc("feedback", [item, ...feedback].slice(0, 200));
    setMsg("");
  }
  async function removeMessage(id) { await saveDoc("feedback", feedback.filter((f) => f.id !== id)); }
  async function clearAllMessages() { if (!window.confirm("This will delete every message in the chat. This can't be undone. Continue?")) return; await saveDoc("feedback", []); }

  return (
    <div>
      <div className="flex items-center justify-between mb-3">
        <SectionHeading emoji="💬" label="Feedback & Chat" accent={PINK} />
        {isOrganiser && feedback.length > 0 && <button onClick={clearAllMessages} className="flex items-center gap-1 text-[10px] normal-case font-semibold px-2 py-1 rounded-full h-fit" style={{ background: "rgba(255,80,80,0.15)", color: "#ff8a8a" }}><Ic size={12}>🗑️</Ic> Clear all</button>}
      </div>
      {chatProfile ? (
        <div className="rounded-2xl p-3 mb-4" style={{ background: "rgba(255,255,255,0.06)" }}>
          <div className="flex items-center gap-2 mb-2 text-xs" style={{ color: "#c9bfe0" }}><CartoonAvatar id={chatProfile.avatarId} size={22} />Posting as <span className="font-bold" style={{ color: PINK }}>{postingAs}</span></div>
          <div className="flex gap-1.5 mb-2 flex-wrap">
            {QUICK_EMOJIS.map((e) => <button key={e} onClick={() => setMsg(msg + e)} className="text-lg leading-none px-1.5 py-1 rounded-lg" style={{ background: "rgba(255,255,255,0.08)" }}>{e}</button>)}
          </div>
          <div className="flex gap-2">
            <textarea value={msg} onChange={(e) => setMsg(e.target.value)} placeholder="Say something…" rows={2} className="flex-1 px-3 py-2 rounded-lg text-sm" style={{ background: "rgba(255,255,255,0.1)", color: "#fff" }} />
            <button onClick={post} disabled={!msg.trim()} className="px-3 rounded-lg" style={{ background: !msg.trim() ? "rgba(255,255,255,0.15)" : PINK, color: "#fff" }}><Ic size={16}>➤</Ic></button>
          </div>
        </div>
      ) : (
        <div className="rounded-2xl p-3 mb-4" style={{ background: "rgba(255,255,255,0.06)" }}>
          <div className="text-xs font-semibold mb-2" style={{ color: "#c9bfe0" }}>Pick a name to chat with (just for this chat, nothing else):</div>
          <div className="grid grid-cols-6 gap-1.5 mb-2">
            {AVATAR_DEFS.map((a) => (<button key={a.id} onClick={() => setAvatarPick(a.id)}><CartoonAvatar id={a.id} size={34} selected={avatarPick === a.id} /></button>))}
          </div>
          <div className="flex gap-2">
            <input value={nameInput} onChange={(e) => setNameInput(e.target.value)} placeholder="Your name" className="flex-1 px-3 py-2 rounded-lg text-sm" style={{ background: "rgba(255,255,255,0.1)", color: "#fff" }} />
            <button onClick={() => nameInput.trim() && onSaveChatProfile({ name: nameInput.trim(), avatarId: avatarPick })} disabled={!nameInput.trim()} className="px-3 rounded-lg font-bold text-xs uppercase" style={{ background: !nameInput.trim() ? "rgba(255,255,255,0.15)" : PINK, color: "#fff" }}>Set</button>
          </div>
        </div>
      )}
      <div className="space-y-2">
        {feedback.length === 0 && <div className="text-sm" style={{ color: "#c9bfe0" }}>No messages yet — be the first to say hi!</div>}
        {feedback.map((f) => (
          <div key={f.id} className="rounded-lg p-3 flex gap-2" style={{ background: "rgba(255,255,255,0.06)" }}>
            {f.avatarId && <CartoonAvatar id={f.avatarId} size={26} />}
            <div className="flex-1">
              <div className="flex justify-between items-start mb-1">
                <span className="font-bold text-xs" style={{ color: GOLD }}>{f.name}</span>
                <div className="flex items-center gap-2"><span className="text-[10px]" style={{ color: "#8f84ab" }}>{new Date(f.ts).toLocaleString()}</span>{isOrganiser && <button onClick={() => removeMessage(f.id)}><Ic size={13}>🗑️</Ic></button>}</div>
              </div>
              <div className="text-sm">{f.message}</div>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

ReactDOM.render(<App />, document.getElementById("root"));
</script>
</body>
</html>
