      {isOrganiser && (
        <div className="flex gap-2 mb-3">
          <button onClick={onCleanDupes} className="flex-1 py-2 rounded-lg font-bold text-[10px] uppercase flex items-center justify-center gap-1" style={{ background: "rgba(255,180,50,0.12)", color: "#ffcf7a", border: "1px solid rgba(255,180,50,0.4)" }}>
            <Ic size={12}>🧹</Ic> Remove Duplicate Test Matches
          </button>
          <button onClick={onRecalc} className="flex-1 py-2 rounded-lg font-bold text-[10px] uppercase flex items-center justify-center gap-1" style={{ background: "rgba(46,213,115,0.12)", color: "#7ee8a8", border: "1px solid rgba(46,213,115,0.4)" }}>
            <Ic size={12}>🔄</Ic> Recalculate Table
          </button>
        </div>
      )}
      <div className="flex gap-2 mb-4">
        <button onClick={() => setStage("group")} className="flex-1 py-1.5 rounded-lg text-xs font-bold uppercase" style={{ background: stage === "group" ? TEAL : "rgba(255,255,255,0.08)", color: stage === "group" ? PURPLE_DEEP : "#c9bfe0" }}>Group Stage</button>
        <button onClick={() => setStage("knockout")} className="flex-1 py-1.5 rounded-lg text-xs font-bold uppercase" style={{ background: stage === "knockout" ? TEAL : "rgba(255,255,255,0.08)", color: stage === "knockout" ? PURPLE_DEEP : "#c9bfe0" }}>Knockout Stage</button>
      </div>
      {stage === "group" ? (
        <>
          {isOrganiser && <div className="text-[11px] mb-3" style={{ color: "#8f84ab" }}>↔️ Scroll sideways to see all columns. Tap ✏️ on a row to fix any stat manually.</div>}
          <PointsTable title="Boys Points Table" rows={points.boys || []} teams={teams.boys || []} qualifiers={4} placeholderCount={6} isOrganiser={isOrganiser} onEdit={(id, name, patch) => onEditRow("boys", id, name, patch)} />
          <PointsTable title="Girls Points Table" rows={points.girls || []} teams={teams.girls || []} qualifiers={2} placeholderCount={3} isOrganiser={isOrganiser} onEdit={(id, name, patch) => onEditRow("girls", id, name, patch)} />
        </>
      ) : (
        <>
          <div className="text-xs font-bold uppercase mb-2" style={{ color: BLUE }}>Boys Knockout — Road to the Final</div>
          <div className="mb-5"><KnockoutBracket schedule={schedule} teams={teams} gender="boys" isOrganiser={isOrganiser} onGenerate={onGenerateKnockout} onSetTeam={onSetKnockoutTeam} onReset={onResetKnockout} /></div>
          <div className="text-xs font-bold uppercase mb-2" style={{ color: RED }}>Girls Knockout — Road to the Final</div>
          <KnockoutBracket schedule={schedule} teams={teams} gender="girls" isOrganiser={isOrganiser} onGenerate={onGenerateKnockout} onSetTeam={onSetKnockoutTeam} onReset={onResetKnockout} />
        </>
      )}
      <div className="text-[11px] mt-3" style={{ color: "#8f84ab" }}>Set D = set difference, Pt D = point difference. Win = 2 pts, Loss = 0. Ranking: Points → Set Diff → Point Diff. Updates automatically when a live match ends.</div>
    </div>
  );
}

function TeamRosterList({ team, gender, roster, isOrganiser, onSetPlayerPhoto, onSetTeamPhoto, onAddIconAsSquadPlayer }) {
  const owner = roster.find((p) => p.role === "owner");
  const iconNames = new Set([team.iconPlayer1, team.iconPlayer2].filter(Boolean));
  const squad = roster.filter((p) => p.role !== "owner" && !iconNames.has(p.nickname || p.name));
  const iconTiles = [
    { name: team.iconPlayer1, photoUrl: team.iconPlayer1PhotoUrl, slot: "iconPlayer1PhotoUrl" },
    { name: team.iconPlayer2, photoUrl: team.iconPlayer2PhotoUrl, slot: "iconPlayer2PhotoUrl" },
  ].filter((x) => x.name);
  if (roster.length === 0 && iconTiles.length === 0) return null;
  return (
    <div className="rounded-xl p-3 mb-2" style={{ background: `linear-gradient(160deg, #1a1a2e 0%, ${team.color}22 100%)`, border: `1px solid ${team.color}` }}>
      <div className="flex items-center justify-between mb-2.5">
        <div className="text-[10px] font-bold uppercase tracking-widest" style={{ color: team.color }}>Squad ({squad.length})</div>
        {owner && <div className="text-[10px]" style={{ color: "#c9bfe0" }}>👑 {owner.nickname || owner.name}</div>}
      </div>
      <div className="grid grid-cols-3 gap-1.5">
        {iconTiles.map((icon, i) => (
          <div key={`icon_${i}`} className="relative rounded-lg overflow-hidden" style={{ aspectRatio: "3/4", background: "#0d0d1a", boxShadow: `0 0 0 2px ${GOLD}` }}>
            <div className="absolute top-1 left-1 z-10 w-5 h-5 rounded-full flex items-center justify-center text-[11px]" style={{ background: GOLD, color: PURPLE_DEEP }}>⭐</div>
            {icon.photoUrl ? (
              <img src={icon.photoUrl} alt={icon.name} className="w-full h-full object-cover" onError={(e) => { e.target.style.display = "none"; }} />
            ) : (
              <div className="w-full h-full flex items-center justify-center" style={{ background: "rgba(255,255,255,0.05)" }}><Ic size={28}>⭐</Ic></div>
            )}
            {isOrganiser && (
              <label className="absolute top-1 right-1 z-10 w-5 h-5 rounded-full flex items-center justify-center cursor-pointer" style={{ background: "rgba(0,0,0,0.6)" }}>
                <Ic size={10}>📷</Ic>
                <input type="file" accept="image/*" className="hidden" onChange={async (e) => {
                  const file = e.target.files && e.target.files[0];
                  e.target.value = "";
                  if (!file || !storage) return;
                  try {
                    const ref = storage.ref().child(`team_icon_${team.id}_${i}_${Date.now()}.${(file.name.split(".").pop() || "jpg").slice(0, 5)}`);
                    await ref.put(file);
                    const url = await ref.getDownloadURL();
                    onSetTeamPhoto(gender, team.id, icon.slot, url);
                  } catch (err) { alert("Upload failed: " + ((err && err.message) || err)); }
                }} />
              </label>
            )}
            <div className="absolute bottom-0 left-0 right-0 px-1 py-1.5 text-center" style={{ background: `linear-gradient(0deg, ${GOLD}f2 0%, ${GOLD}00 100%)` }}>
              <div className="text-[10px] font-black uppercase truncate" style={{ color: PURPLE_DEEP, fontFamily: "'Bebas Neue', sans-serif", letterSpacing: "0.03em" }}>{icon.name}</div>
              <div className="text-[7px] font-semibold truncate" style={{ color: "rgba(26,21,80,0.85)" }}>Icon Player</div>
            </div>
            {isOrganiser && !roster.some((r) => (r.nickname || r.name) === icon.name) && (
              <button onClick={() => onAddIconAsSquadPlayer(gender, team.id, icon.name, icon.photoUrl)} className="absolute bottom-8 left-0.5 right-0.5 text-[7px] font-bold uppercase py-0.5 rounded" style={{ background: "rgba(0,0,0,0.65)", color: "#7ee8a8" }}>+ Add to squad (for lineups)</button>
            )}
          </div>
        ))}
        {squad.map((p, i) => (
          <div key={p.id} className="relative rounded-lg overflow-hidden" style={{ aspectRatio: "3/4", background: "#0d0d1a" }}>
            <div className="absolute top-1 left-1 z-10 w-5 h-5 rounded-full flex items-center justify-center text-[10px] font-black" style={{ background: team.color, color: "#1a1a2e" }}>{i + 1}</div>
            {p.photoUrl ? (
              <img src={p.photoUrl} alt={p.name} className="w-full h-full object-cover" onError={(e) => { e.target.style.display = "none"; }} />
            ) : (
              <div className="w-full h-full flex items-center justify-center"><CartoonAvatar id={p.avatarId} size={48} /></div>
            )}
            {isOrganiser && (
              <label className="absolute top-1 right-1 z-10 w-5 h-5 rounded-full flex items-center justify-center cursor-pointer" style={{ background: "rgba(0,0,0,0.6)" }}>
                <Ic size={10}>📷</Ic>
                <input type="file" accept="image/*" className="hidden" onChange={async (e) => {
                  const file = e.target.files && e.target.files[0];
                  e.target.value = "";
                  if (!file || !storage) return;
                  try {
                    const ref = storage.ref().child(`player_photo_${p.id}_${Date.now()}.${(file.name.split(".").pop() || "jpg").slice(0, 5)}`);
                    await ref.put(file);
                    const url = await ref.getDownloadURL();
                    onSetPlayerPhoto(p.id, url);
                  } catch (err) { alert("Upload failed: " + ((err && err.message) || err)); }
                }} />
              </label>
            )}
            <div className="absolute bottom-0 left-0 right-0 px-1 py-1.5 text-center" style={{ background: `linear-gradient(0deg, ${team.color}f2 0%, ${team.color}00 100%)` }}>
              <div className="text-[10px] font-black uppercase truncate" style={{ color: "#fff", fontFamily: "'Bebas Neue', sans-serif", letterSpacing: "0.03em" }}>{p.nickname || p.name}</div>
              {p.position && <div className="text-[7px] font-semibold truncate" style={{ color: "rgba(255,255,255,0.9)" }}>{p.position}</div>}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

function TeamsTab({ teams, players, points, isOrganiser }) {
  const [gender, setGender] = useState("boys");
  const [newName, setNewName] = useState("");
  const [newColor, setNewColor] = useState(TEAM_COLORS[0]);
  const [posterEdits, setPosterEdits] = useState({});
  const [renamingId, setRenamingId] = useState(null);
  const [renameInput, setRenameInput] = useState("");
  const selfRegistered = players.filter((p) => p.source === "self").sort((a, b) => (b.registeredAt || 0) - (a.registeredAt || 0));

  async function addTeam() {
    if (!newName.trim()) return;
    const id = `t_${Date.now()}`;
    const newTeams = { ...teams, [gender]: [...(teams[gender] || []), { id, name: newName.trim(), color: newColor, logoUrl: null, posterUrl: null }] };
    const newPointsRows = { ...points, [gender]: [...(points[gender] || []), emptyPointsRow(id, newName.trim())] };
    await saveDoc("teams", newTeams); await saveDoc("points", newPointsRows);
    setNewName("");
  }
  async function renameTeam(g, teamId, newName) {
    const trimmed = newName.trim();
    if (!trimmed) return;
    const newTeams = { ...teams, [g]: teams[g].map((t) => t.id === teamId ? { ...t, name: trimmed } : t) };
    const newPoints = { ...points, [g]: (points[g] || []).map((r) => r.teamId === teamId ? { ...r, teamName: trimmed } : r) };
    await saveDoc("teams", newTeams);
    await saveDoc("points", newPoints);
  }
  async function removeTeam(g, teamId, teamName) {
    const squadCount = players.filter((p) => p.teamId === teamId).length;
    const msg = squadCount > 0
      ? `${teamName} has ${squadCount} player(s) sold to it. Deleting the team will send those players back to the unsold pool. This can't be undone. Continue?`
      : `Delete ${teamName}? This can't be undone.`;
    if (!window.confirm(msg)) return;
    const newTeams = { ...teams, [g]: (teams[g] || []).filter((t) => t.id !== teamId) };
    const newPoints = { ...points, [g]: (points[g] || []).filter((r) => r.teamId !== teamId) };
    const newPlayers = players.map((p) => p.teamId === teamId ? { ...p, teamId: null, auctionStatus: null, soldAt: null } : p);
    await saveDoc("teams", newTeams);
    await saveDoc("points", newPoints);
    if (squadCount > 0) await saveDoc("players", newPlayers);
  }
  async function savePoster(g, teamId) {
    const url = posterEdits[teamId];
    if (url === undefined) return;
    const newTeams = { ...teams, [g]: teams[g].map((t) => t.id === teamId ? { ...t, posterUrl: url.trim() || null } : t) };
    await saveDoc("teams", newTeams);
  }
  async function setIconPlayer(g, teamId, slot, playerName, photoUrl) {
    const photoSlot = slot + "PhotoUrl";
    const newTeams = { ...teams, [g]: teams[g].map((t) => t.id === teamId ? { ...t, [slot]: playerName || null, [photoSlot]: playerName ? (photoUrl || null) : null } : t) };
    await saveDoc("teams", newTeams);
  }
  async function setTeamPhoto(g, teamId, field, url) {
    const newTeams = { ...teams, [g]: teams[g].map((t) => t.id === teamId ? { ...t, [field]: url } : t) };
    await saveDoc("teams", newTeams);
  }
  async function setPlayerPhoto(playerId, url) {
    await saveDoc("players", players.map((p) => p.id === playerId ? { ...p, photoUrl: url } : p));
  }
  async function addIconAsSquadPlayer(g, teamId, name, photoUrl) {
    if (!window.confirm(`Add "${name}" as an actual squad player for this team? This makes them selectable for match lineups and live scoring, in addition to showing as an icon player.`)) return;
    const entry = { id: `p_icon_${Date.now()}`, name, nickname: "", role: "player", gender: g, category: null, college: null, teamId, position: null, photoUrl: photoUrl || null, avatarId: AVATAR_DEFS[Math.floor(Math.random() * AVATAR_DEFS.length)].id, auctionStatus: "sold", soldAt: Date.now() };
    await saveDoc("players", [...players, entry]);
  }
  async function clearAllPlayers() {
    if (!window.confirm("This will remove every registered player and owner, and empty every team roster and the auction pool. This can't be undone. Continue?")) return;
    await saveDoc("players", []);
  }
  async function clearSelfRegistered() {
    const junk = players.filter((p) => p.source === "self");
    if (junk.length === 0) { alert("No leftover self-registered entries found — nothing to clean."); return; }
    if (!window.confirm(`Found ${junk.length} old self-registered "create your card" entries. This removes only those and leaves your real roster (from the Excel import) completely untouched. Continue?`)) return;
    await saveDoc("players", players.filter((p) => p.source !== "self"));
  }
  async function resetTeamsAndAuction() {
    if (!window.confirm("This clears ALL teams, ALL players, and resets the points table for both Boys and Girls — a full clean slate. This can't be undone. Continue?")) return;
    await saveDoc("teams", { boys: [], girls: [] });
    await saveDoc("players", []);
    await saveDoc("points", { boys: [], girls: [] });
  }
  function playersFor(teamId) { return players.filter((p) => p.teamId === teamId); }

  return (
    <div>
      <SectionHeading emoji="👥" label="Teams" accent={TEAL} />
      {["boys", "girls"].map((g) => {
        const unsoldCount = players.filter((p) => p.gender === g && !p.teamId).length;
        return (
          <div key={g} className="mb-5">
            <div className="text-xs font-bold uppercase mb-2 tracking-wide flex items-center justify-between" style={{ color: GOLD }}>
              <span>{g === "boys" ? "Boys Teams (6)" : "Girls Teams (3)"}</span>
              {unsoldCount > 0 && <span className="text-[10px] normal-case font-normal" style={{ color: "#c9bfe0" }}>{unsoldCount} waiting in auction pool</span>}
            </div>
            {(teams[g] || []).length === 0 && <div className="text-sm mb-2" style={{ color: "#c9bfe0" }}>No teams added yet.</div>}
            <div className="space-y-2">
              {(teams[g] || []).map((t) => (
                <div key={t.id} className="rounded-xl p-3" style={{ background: "rgba(255,255,255,0.06)" }}>
                  {renamingId === t.id ? (
                    <div className="flex items-center gap-2 mb-2">
                      <TeamBadge team={t} size={32} />
                      <input value={renameInput} onChange={(e) => setRenameInput(e.target.value)} className="flex-1 px-2 py-1 rounded-lg text-sm" style={{ background: "rgba(255,255,255,0.1)", color: "#fff" }} autoFocus />
                      <button onClick={async () => { await renameTeam(g, t.id, renameInput); setRenamingId(null); }} className="text-xs px-2 py-1 rounded-full" style={{ background: GOLD, color: PURPLE_DEEP }}><Ic size={12}>✓</Ic></button>
                      <button onClick={() => setRenamingId(null)} className="text-xs px-2 py-1 rounded-full" style={{ background: "rgba(255,255,255,0.1)", color: "#fff" }}><Ic size={12}>✕</Ic></button>
                    </div>
                  ) : (
                    <div className="flex items-center gap-2 mb-2">
                      <TeamBadge team={t} size={32} />
                      <div className="font-bold text-sm flex-1">{t.name}</div>
                      {isOrganiser && <button onClick={() => { setRenamingId(t.id); setRenameInput(t.name); }} className="text-xs px-2 py-1 rounded-full" style={{ background: "rgba(84,160,255,0.15)", color: "#54a0ff" }}><Ic size={12}>✏️</Ic></button>}
                      {isOrganiser && <button onClick={() => removeTeam(g, t.id, t.name)} className="text-xs px-2 py-1 rounded-full" style={{ background: "rgba(255,80,80,0.15)", color: "#ff8a8a" }}><Ic size={12}>🗑️</Ic></button>}
                    </div>
                  )}
                  {isOrganiser && (
                    <div className="flex gap-2 mb-2">
                      <PhotoUploadButton pathPrefix={`team_logo_${t.id}`} label="Team logo" onUploaded={(url) => setTeamPhoto(g, t.id, "logoUrl", url)} />
                      <PhotoUploadButton pathPrefix={`owner_photo_${t.id}`} label="Owner photo" onUploaded={(url) => setTeamPhoto(g, t.id, "ownerPhotoUrl", url)} />
                    </div>
                  )}
                  {t.ownerName && (
                    <div className="flex items-center gap-2 mb-2 rounded-lg p-2" style={{ background: "rgba(255,255,255,0.05)" }}>
                      {t.ownerPhotoUrl ? (
                        <img src={t.ownerPhotoUrl} alt={t.ownerName} className="w-9 h-9 rounded-full object-cover flex-shrink-0" style={{ border: `2px solid ${t.color}` }} onError={(e) => { e.target.style.display = "none"; }} />
                      ) : null}
                      <div className="flex-1 min-w-0">
                        <div className="text-[9px] uppercase font-bold tracking-wide" style={{ color: "#8f84ab" }}>Team Owner</div>
                        <div className="text-xs font-semibold truncate">👑 {t.ownerName}</div>
                      </div>
                    </div>
                  )}
                  {(t.iconPlayer1 || t.iconPlayer2) && (
                    <div className="flex items-center gap-3 mb-2 rounded-lg p-2" style={{ background: "rgba(255,255,255,0.05)" }}>
                      {[[t.iconPlayer1, t.iconPlayer1PhotoUrl], [t.iconPlayer2, t.iconPlayer2PhotoUrl]].filter(([n]) => n).map(([name, photo], i) => (
                        <div key={i} className="flex items-center gap-1.5 min-w-0">
                          {photo ? (
                            <img src={photo} alt={name} className="w-7 h-7 rounded-full object-cover flex-shrink-0" style={{ border: `1.5px solid ${GOLD}` }} onError={(e) => { e.target.style.display = "none"; }} />
                          ) : (
                            <span className="w-7 h-7 rounded-full flex items-center justify-center flex-shrink-0" style={{ background: "rgba(255,255,255,0.1)" }}><Ic size={12}>⭐</Ic></span>
                          )}
                          <span className="text-[10px] truncate" style={{ color: "#c9bfe0" }}>{name}</span>
                        </div>
                      ))}
                    </div>
                  )}
                  {isOrganiser && (
                    <div className="mb-2">
                      <div className="flex gap-2 mb-1.5">
                        <select value={t.iconPlayer1 || ""} onChange={(e) => {
                          const val = e.target.value;
                          const ownerPick = val === t.ownerName;
                          const p = playersFor(t.id).find((pp) => (pp.nickname || pp.name) === val);
                          setIconPlayer(g, t.id, "iconPlayer1", val, ownerPick ? t.ownerPhotoUrl : (p ? p.photoUrl : null));
                        }} className="flex-1 px-2 py-1.5 rounded-lg text-[11px]" style={{ background: "rgba(255,255,255,0.1)", color: "#fff" }}>
                          <option value="">⭐ Icon player 1…</option>
                          {t.ownerName && <option value={t.ownerName}>👑 {t.ownerName} (owner)</option>}
                          {playersFor(t.id).map((p) => (<option key={p.id} value={p.nickname || p.name}>{p.nickname || p.name}</option>))}
                        </select>
                        <select value={t.iconPlayer2 || ""} onChange={(e) => {
                          const val = e.target.value;
                          const ownerPick = val === t.ownerName;
                          const p = playersFor(t.id).find((pp) => (pp.nickname || pp.name) === val);
                          setIconPlayer(g, t.id, "iconPlayer2", val, ownerPick ? t.ownerPhotoUrl : (p ? p.photoUrl : null));
                        }} className="flex-1 px-2 py-1.5 rounded-lg text-[11px]" style={{ background: "rgba(255,255,255,0.1)", color: "#fff" }}>
                          <option value="">⭐ Icon player 2…</option>
                          {t.ownerName && <option value={t.ownerName}>👑 {t.ownerName} (owner)</option>}
                          {playersFor(t.id).map((p) => (<option key={p.id} value={p.nickname || p.name}>{p.nickname || p.name}</option>))}
                        </select>
                      </div>
                      <div className="flex gap-2">
                        {t.iconPlayer1 && <PhotoUploadButton pathPrefix={`icon1_${t.id}`} label={`📷 ${t.iconPlayer1}'s photo`} onUploaded={(url) => setTeamPhoto(g, t.id, "iconPlayer1PhotoUrl", url)} />}
                        {t.iconPlayer2 && <PhotoUploadButton pathPrefix={`icon2_${t.id}`} label={`📷 ${t.iconPlayer2}'s photo`} onUploaded={(url) => setTeamPhoto(g, t.id, "iconPlayer2PhotoUrl", url)} />}
                      </div>
                    </div>
                  )}
                  {playersFor(t.id).length === 0 ? (
                    <div className="text-xs mb-2" style={{ color: "#8f84ab" }}>No players sold to this team yet — the squad list builds itself automatically as the auction fills the team.</div>
                  ) : (
                    <TeamRosterList team={t} gender={g} roster={playersFor(t.id)} isOrganiser={isOrganiser} onSetPlayerPhoto={setPlayerPhoto} onSetTeamPhoto={setTeamPhoto} onAddIconAsSquadPlayer={addIconAsSquadPlayer} />
                  )}
                  {t.posterUrl && <img src={t.posterUrl} alt={`${t.name} poster`} className="w-full rounded-lg mb-2 mt-2" style={{ maxHeight: 160, objectFit: "cover" }} onError={(e) => { e.target.style.display = "none"; }} />}
                  {isOrganiser && (
                    <div className="flex gap-2 mt-2 items-center">
                      <input placeholder="Or paste a custom poster image URL" defaultValue={t.posterUrl || ""} onChange={(e) => setPosterEdits({ ...posterEdits, [t.id]: e.target.value })} className="flex-1 px-2 py-1.5 rounded-lg text-xs" style={{ background: "rgba(255,255,255,0.1)", color: "#fff" }} />
                      <button onClick={() => savePoster(g, t.id)} className="px-2 rounded-lg" style={{ background: GOLD, color: PURPLE_DEEP }}><Ic size={14}>🖼️</Ic></button>
                      <PhotoUploadButton pathPrefix={`team_poster_${t.id}`} label="Upload" onUploaded={(url) => setTeamPhoto(g, t.id, "posterUrl", url)} />
                    </div>
                  )}
                </div>
              ))}
            </div>
          </div>
        );
      })}
      {isOrganiser && (
        <div className="rounded-2xl p-4" style={{ background: "rgba(255,255,255,0.06)", border: `1px solid ${TEAL}` }}>
          <div className="text-xs font-bold uppercase mb-2" style={{ color: TEAL }}>Add a team</div>
          <div className="flex gap-2 mb-2">
            <button onClick={() => setGender("boys")} className="flex-1 py-1.5 rounded-lg text-xs font-bold uppercase" style={{ background: gender === "boys" ? GOLD : "rgba(255,255,255,0.1)", color: gender === "boys" ? PURPLE_DEEP : "#fff" }}>Boys</button>
            <button onClick={() => setGender("girls")} className="flex-1 py-1.5 rounded-lg text-xs font-bold uppercase" style={{ background: gender === "girls" ? GOLD : "rgba(255,255,255,0.1)", color: gender === "girls" ? PURPLE_DEEP : "#fff" }}>Girls</button>
          </div>
          <input value={newName} onChange={(e) => setNewName(e.target.value)} placeholder="Team name" className="w-full px-3 py-2 rounded-lg text-sm mb-2" style={{ background: "rgba(255,255,255,0.1)", color: "#fff" }} />
          <div className="text-[11px] uppercase mb-1.5 font-semibold" style={{ color: "#c9bfe0" }}>Badge color</div>
          <div className="flex gap-2 mb-3 flex-wrap">{TEAM_COLORS.map((c) => (<button key={c} onClick={() => setNewColor(c)} className="w-7 h-7 rounded-full" style={{ background: c, border: newColor === c ? `2px solid ${GOLD}` : "2px solid transparent" }} />))}</div>
          <button onClick={addTeam} className="w-full py-2 rounded-lg font-bold text-sm uppercase flex items-center justify-center gap-1" style={{ background: GOLD, color: PURPLE_DEEP }}><Ic size={16}>➕</Ic> Add Team</button>
        </div>
      )}
      {isOrganiser && (
        <div className="rounded-2xl p-4 mt-4" style={{ background: "rgba(255,255,255,0.06)", border: `1px solid ${TEAL}` }}>
          <div className="text-xs font-bold uppercase mb-2" style={{ color: TEAL }}>Registered via App ({selfRegistered.length})</div>
          {selfRegistered.length === 0 ? (
            <div className="text-xs" style={{ color: "#c9bfe0" }}>No one has registered through the app yet.</div>
          ) : (
            <div className="space-y-1.5 max-h-64 overflow-y-auto">
              {selfRegistered.map((p) => (
                <div key={p.id} className="flex items-center gap-2 px-2 py-1.5 rounded-lg" style={{ background: "rgba(255,255,255,0.05)" }}>
                  <CartoonAvatar id={p.avatarId} size={22} />
                  <span className="text-xs flex-1">{p.nickname || p.name}</span>
                  <RoleTag role={p.role} />
                  <span className="text-[9px] font-bold px-1.5 py-0.5 rounded-full uppercase" style={{ background: "rgba(255,255,255,0.1)", color: "#c9bfe0" }}>{p.gender}</span>
                </div>
              ))}
            </div>
          )}
        </div>
      )}
      {isOrganiser && (
        <div className="rounded-2xl p-4 mt-4" style={{ background: "rgba(255,80,80,0.06)", border: "1px solid rgba(255,120,120,0.4)" }}>
          <div className="text-xs font-bold uppercase mb-2" style={{ color: "#ff8a8a" }}>Danger zone</div>
          <button onClick={clearSelfRegistered} className="w-full py-2 rounded-lg font-bold text-xs uppercase flex items-center justify-center gap-1 mb-2" style={{ background: "rgba(255,180,50,0.15)", color: "#ffcf7a", border: "1px solid rgba(255,180,50,0.4)" }}><Ic size={14}>🧹</Ic> Remove Old Self-Registered Entries (keeps real roster)</button>
          <button onClick={clearAllPlayers} className="w-full py-2 rounded-lg font-bold text-xs uppercase flex items-center justify-center gap-1" style={{ background: "rgba(255,80,80,0.15)", color: "#ff8a8a", border: "1px solid rgba(255,120,120,0.4)" }}><Ic size={14}>🗑️</Ic> Clear All Registered Players</button>
          <button onClick={resetTeamsAndAuction} className="w-full py-2 rounded-lg font-bold text-xs uppercase flex items-center justify-center gap-1 mt-2" style={{ background: "rgba(255,80,80,0.15)", color: "#ff8a8a", border: "1px solid rgba(255,120,120,0.4)" }}><Ic size={14}>🗑️</Ic> Full Reset (clear teams + players + points)</button>
        </div>
      )}
    </div>
  );
}

/* ---------------- FEEDBACK TAB ---------------- */
/* ---------------- SPONSORS TAB ---------------- */
function SponsorsTab({ sponsors, isOrganiser }) {
  const [caption, setCaption] = useState("");

  async function addSponsor(url) {
    const item = { id: `sp_${Date.now()}`, url, caption: caption.trim() || null, addedAt: Date.now() };
    await saveDoc("sponsors", [...sponsors, item]);
    setCaption("");
  }
  async function removeSponsor(id) {
    if (!window.confirm("Remove this poster?")) return;
    await saveDoc("sponsors", sponsors.filter((s) => s.id !== id));
  }

  return (
    <div>
      <SectionHeading emoji="🤝" label="Sponsors & Supporters" accent={ORANGE} />
      {isOrganiser && (
        <div className="rounded-2xl p-3 mb-4" style={{ background: "rgba(255,255,255,0.06)" }}>
          <div className="text-xs font-semibold mb-2" style={{ color: "#c9bfe0" }}>Add a sponsor logo or supporting team poster:</div>
          <input value={caption} onChange={(e) => setCaption(e.target.value)} placeholder="Caption (optional) — e.g. 'Powered by Kshema'" className="w-full px-3 py-2 rounded-lg text-sm mb-2" style={{ background: "rgba(255,255,255,0.1)", color: "#fff" }} />
          <PhotoUploadButton pathPrefix="sponsor" label="📷 Upload poster/logo" onUploaded={addSponsor} />
        </div>
      )}
      {sponsors.length === 0 ? (
        <div className="text-sm" style={{ color: "#c9bfe0" }}>No sponsors or supporter posters added yet.</div>
      ) : (
        <div className="grid grid-cols-2 gap-2">
          {sponsors.map((s) => (
            <div key={s.id} className="relative rounded-xl overflow-hidden" style={{ background: "rgba(255,255,255,0.06)" }}>
              <img src={s.url} alt={s.caption || "Sponsor"} className="w-full object-cover" style={{ aspectRatio: "1/1" }} onError={(e) => { e.target.style.opacity = "0.2"; }} />
              {s.caption && <div className="px-2 py-1.5 text-[10px] font-semibold text-center truncate">{s.caption}</div>}
              {isOrganiser && (
                <button onClick={() => removeSponsor(s.id)} className="absolute top-1 right-1 w-6 h-6 rounded-full flex items-center justify-center" style={{ background: "rgba(0,0,0,0.6)" }}><Ic size={12}>🗑️</Ic></button>
              )}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function FeedbackTab({ feedback, visitor, isOrganiser }) {
  const [msg, setMsg] = useState("");
  const postingAs = visitor ? (visitor.realName ? `${visitor.name} (${visitor.realName})` : visitor.name) : (isOrganiser ? "Organiser" : null);
  const postingAvatar = visitor ? visitor.avatarId : null;
  const QUICK_EMOJIS = ["👍", "🔥", "🏐", "😂", "❤️", "🎉", "👏", "😮"];
  async function post() {
    if (!msg.trim() || !postingAs) return;
    const item = { id: `f_${Date.now()}`, name: postingAs, message: msg.trim(), ts: Date.now(), avatarId: postingAvatar };
    await saveDoc("feedback", [item, ...feedback].slice(0, 200));
    setMsg("");
  }
  async function removeMessage(id) { await saveDoc("feedback", feedback.filter((f) => f.id !== id)); }
  async function clearAllMessages() { if (!window.confirm("This will delete every message in the chat. This can't be undone. Continue?")) return; await saveDoc("feedback", []); }

  return (
    <div>
      <div className="flex items-center justify-between mb-3">
        <SectionHeading emoji="💬" label="Feedback & Chat" accent={PINK} />
        {isOrganiser && feedback.length > 0 && <button onClick={clearAllMessages} className="flex items-center gap-1 text-[10px] normal-case font-semibold px-2 py-1 rounded-full h-fit" style={{ background: "rgba(255,80,80,0.15)", color: "#ff8a8a" }}><Ic size={12}>🗑️</Ic> Clear all</button>}
      </div>
      <div className="rounded-2xl p-3 mb-4" style={{ background: "rgba(255,255,255,0.06)" }}>
        <div className="flex items-center gap-2 mb-2 text-xs" style={{ color: "#c9bfe0" }}>{postingAvatar && <CartoonAvatar id={postingAvatar} size={22} />}Posting as <span className="font-bold" style={{ color: PINK }}>{postingAs}</span></div>
        <div className="flex gap-1.5 mb-2 flex-wrap">
          {QUICK_EMOJIS.map((e) => <button key={e} onClick={() => setMsg(msg + e)} className="text-lg leading-none px-1.5 py-1 rounded-lg" style={{ background: "rgba(255,255,255,0.08)" }}>{e}</button>)}
        </div>
        <div className="flex gap-2">
          <textarea value={msg} onChange={(e) => setMsg(e.target.value)} placeholder="Say something…" rows={2} className="flex-1 px-3 py-2 rounded-lg text-sm" style={{ background: "rgba(255,255,255,0.1)", color: "#fff" }} />
          <button onClick={post} disabled={!msg.trim()} className="px-3 rounded-lg" style={{ background: !msg.trim() ? "rgba(255,255,255,0.15)" : PINK, color: "#fff" }}><Ic size={16}>➤</Ic></button>
        </div>
      </div>
      <div className="space-y-2">
        {feedback.length === 0 && <div className="text-sm" style={{ color: "#c9bfe0" }}>No messages yet — be the first to say hi!</div>}
        {feedback.map((f) => (
          <div key={f.id} className="rounded-lg p-3 flex gap-2" style={{ background: "rgba(255,255,255,0.06)" }}>
            {f.avatarId && <CartoonAvatar id={f.avatarId} size={26} />}
            <div className="flex-1">
              <div className="flex justify-between items-start mb-1">
                <span className="font-bold text-xs" style={{ color: GOLD }}>{f.name}</span>
                <div className="flex items-center gap-2"><span className="text-[10px]" style={{ color: "#8f84ab" }}>{new Date(f.ts).toLocaleString()}</span>{isOrganiser && <button onClick={() => removeMessage(f.id)}><Ic size={13}>🗑️</Ic></button>}</div>
              </div>
              <div className="text-sm">{f.message}</div>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

ReactDOM.render(<App />, document.getElementById("root"));
</script>
</body>
</html>
